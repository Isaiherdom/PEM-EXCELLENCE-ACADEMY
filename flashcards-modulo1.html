<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Módulo 1 · ISO 9001</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  :root{
    --bg:#070B0A; --surface:#0D1311; --line:#24302B;
    --green:#22E88A; --amber:#FF7A1A; --text:#FFFFFF; --muted:#AAB5AF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;
  }
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:24px;}

  .stage{width:100%;max-width:460px;perspective:1400px;}
  .card{
    position:relative;width:100%;height:300px;cursor:pointer;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    padding:28px;border:1px solid var(--line);
  }
  .front{background:var(--surface);}
  .back{background:linear-gradient(160deg,#0E241A,#141815);transform:rotateY(180deg);border-color:var(--green);}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:14px;}
  .term{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;line-height:1.25;}
  .def{font-size:14.5px;line-height:1.55;color:var(--text);}
  .flip-hint{position:absolute;bottom:14px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  .controls{display:flex;gap:12px;margin-top:26px;width:100%;max-width:460px;}
  button{
    flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;
  }
  button:hover{border-color:var(--green);}
  button.primary{background:var(--green);color:#06140D;border:none;}
  .dots{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;justify-content:center;max-width:460px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--green);}
</style>
</head>
<body>
<script src="assets/auth-config.js"></script>
<div id="pemGateOverlay" style="position:fixed;inset:0;z-index:2147483647;background:#0B0E0C;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:340px;width:100%;background:#141815;border:1px solid #26302A;border-radius:14px;padding:28px 24px;text-align:center;font-family:'Inter',sans-serif;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#16C270;text-transform:uppercase;margin-bottom:10px;">PEM Excellence Academy</div>
    <div style="color:#F1F3F0;font-size:14px;margin-bottom:16px;">Acceso restringido — ingresa la contraseña</div>
    <input type="password" id="pemGatePw" style="width:100%;box-sizing:border-box;padding:11px;font-size:15px;background:#0B0E0C;border:1px solid #26302A;color:#F1F3F0;border-radius:8px;margin-bottom:10px;" placeholder="Contraseña">
    <button onclick="pemGateSubmit()" style="width:100%;background:#16C270;color:#06140D;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">Entrar</button>
    <div id="pemGateError" style="color:#E8603D;font-size:12px;margin-top:10px;display:none;">Contraseña incorrecta</div>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem('pemAuthOK') === '1'){
    document.getElementById('pemGateOverlay').style.display = 'none';
  }
})();
async function pemGateSubmit(){
  const pw = document.getElementById('pemGatePw').value;
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if(hash === PEM_AUTH_HASH){
    sessionStorage.setItem('pemAuthOK','1');
    document.getElementById('pemGateOverlay').style.display = 'none';
  } else {
    document.getElementById('pemGateError').style.display = 'block';
  }
}
document.addEventListener('DOMContentLoaded', function(){
  var el = document.getElementById('pemGatePw');
  if(el) el.addEventListener('keydown', function(e){ if(e.key==='Enter') pemGateSubmit(); });
});
</script>



  <div class="eyebrow">PEM Excellence Academy</div>
  <h1>Flashcards — Módulo 1</h1>
  <div class="sub">Fundamentos ISO 9001 · toca la tarjeta para ver la respuesta</div>
  <div class="counter" id="counter">1 / 10</div>

  <div class="stage">
    <div class="card" id="card" onclick="flip()">
      <div class="face front">
        <div class="tag">Término</div>
        <div class="term" id="termText"></div>
        <div class="flip-hint">Toca para ver la definición</div>
      </div>
      <div class="face back">
        <div class="tag">En PEM significa</div>
        <div class="def" id="defText"></div>
        <div class="flip-hint">Toca para volver</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">Anterior</button>
    <button class="primary" id="btnNext" onclick="next()">Siguiente</button>
  </div>
  <div class="dots" id="dots"></div>

<script>
const CARDS = [
  {term:"SGC", def:"Sistema de Gestión de Calidad: la forma organizada en que PEM planea, opera y controla su trabajo para que el resultado sea consistente en los sitios de trabajo."},
  {term:"Enfoque a procesos", def:"Ver la operación como una cadena de pasos conectados (ej. recepción de orden → despacho de compresor → operación en campo → reporte) en lugar de tareas aisladas."},
  {term:"PHVA", def:"Planificar–Hacer–Verificar–Actuar. El ciclo de mejora continua: planear el mantenimiento, ejecutarlo, verificar contra especificación, y actuar sobre las desviaciones."},
  {term:"Contexto de la organización", def:"Los factores internos y externos —clientes como PEMEX y CFE, normativa, condiciones de campo— que afectan la capacidad de PEM para operar."},
  {term:"Parte interesada", def:"Cualquier actor con interés legítimo en el desempeño de PEM: clientes, autoridades, empleados, proveedores críticos."},
  {term:"No conformidad", def:"Un desvío frente a un requisito —procedimiento, especificación del cliente o norma— que debe identificarse, registrarse y corregirse."},
  {term:"Alcance del SGC", def:"Los servicios y ubicaciones que cubre el sistema de calidad de PEM: compresión reciprocante, well testing, desarenamiento, plantas de aminas, AMS, entre otros."},
  {term:"Riesgo operacional", def:"Una condición que podría impedir que PEM entregue el servicio como se comprometió con el cliente; se identifica antes de que se convierta en falla."},
  {term:"Control operacional", def:"Las acciones planeadas que aseguran que cada tarea de campo se ejecute bajo condiciones controladas: torque correcto, registro de mantenimiento, reporte de anomalías."},
  {term:"Mejora continua", def:"El compromiso de PEM de no repetir el mismo error dos veces: cada no conformidad genera un ajuste real al proceso."}
];

let idx = 0;
let flipped = false;

function render(){
  document.getElementById('termText').textContent = CARDS[idx].term;
  document.getElementById('defText').textContent = CARDS[idx].def;
  document.getElementById('counter').textContent = (idx+1)+' / '+CARDS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  const dots = document.getElementById('dots');
  dots.innerHTML = CARDS.map((_,i)=>`<div class="dot ${i===idx?'active':''}"></div>`).join('');
  document.getElementById('btnNext').textContent = (idx === CARDS.length - 1) ? 'Terminar ✓' : 'Siguiente';
}
function flip(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}
function next(){
  if(idx === CARDS.length - 1){
    window.location.href = 'index.html';
    return;
  }
  idx = (idx+1)%CARDS.length; render();
}
function prev(){ idx = (idx-1+CARDS.length)%CARDS.length; render(); }

render();
</script>
<script src="assets/shell.js" defer></script>
</body>
</html>
