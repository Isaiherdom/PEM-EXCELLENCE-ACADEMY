<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias · PEM Excellence Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/noticias.js"></script>
<style>
  :root{
    --bg:#F5F6F3; --panel:#FFFFFF; --ink:#15201D; --muted:#68736F; --line:#E3E7E3;
    --green:#087F5B; --green2:#19A974; --mint:#DFF3EA;
    --blue:#4D78B8; --blueSoft:#E6EEF9;
    --gold:#C7923E; --goldSoft:#F8EDD9;
    --red:#C76A58; --redSoft:#F7E5E0;
    --shadow:0 8px 24px rgba(24,39,33,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}

  body[data-pem-no-shell-header]{padding-top:var(--home-nav-h,64px) !important;}
  body[data-pem-no-shell-header] .pem-sidebar{top:var(--home-nav-h,64px) !important;height:calc(100vh - var(--home-nav-h,64px)) !important;}
  body[data-pem-no-shell-header] .pem-sidebar-brand{display:none;}
  .exec-nav{position:fixed;top:0;left:0;right:0;z-index:9500;display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);margin-left:calc(-1 * var(--pem-sb-w,0px));width:calc(100% + var(--pem-sb-w,0px));}
  .exec-nav .burger{display:none;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;color:var(--ink);cursor:pointer;}
  .exec-nav .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
  .exec-nav .wordmark span{color:var(--green);}
  @media(max-width:900px){
    .exec-nav{margin-left:0;width:100%;}
    .exec-nav .burger{display:inline-flex;}
  }

  .wrap{max-width:820px;margin:0 auto;padding:26px 28px 60px;}
  .header{margin-bottom:20px;}
  .kicker{font-size:10.5px;letter-spacing:2px;color:var(--green);font-weight:800;text-transform:uppercase;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,3.4vw,34px);margin:6px 0 5px;letter-spacing:-.5px;}
  .subtitle{font-size:13.5px;color:var(--muted);max-width:700px;line-height:1.6;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  .kpi{padding:17px 18px;}
  .kpi .label{font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:800;text-transform:uppercase;}
  .kpi .value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px;}
  .kpi .foot{font-size:11px;color:var(--muted);}

  .notice{display:flex;gap:16px;padding:20px 22px;margin-bottom:12px;}
  .notice .ic{width:42px;height:42px;border-radius:11px;background:var(--nc-bg,var(--mint));color:var(--nc,var(--green));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .notice-body{flex:1;}
  .notice-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .notice-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;margin-bottom:6px;}
  .notice-text{color:var(--muted);font-size:13px;line-height:1.6;}

  .empty{text-align:center;padding:60px 24px;color:var(--muted);}

  @media(max-width:700px){
    .wrap{padding:18px 14px 50px;}
    .grid3{grid-template-columns:1fr;}
  }
</style>
</head>
<body data-pem-no-shell-header>
<script src="assets/auth-config.js"></script>
<div id="pemGateOverlay" style="position:fixed;inset:0;z-index:2147483647;background:#0B0E0C;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:340px;width:100%;background:#141815;border:1px solid #26302A;border-radius:14px;padding:28px 24px;text-align:center;font-family:'Inter',sans-serif;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#16C270;text-transform:uppercase;margin-bottom:10px;">PEM Excellence Academy</div>
    <div style="color:#F1F3F0;font-size:14px;margin-bottom:16px;">Acceso restringido — ingresa la contraseña</div>
    <input type="password" id="pemGatePw" style="width:100%;box-sizing:border-box;padding:11px;font-size:15px;background:#0B0E0C;border:1px solid #26302A;color:#F1F3F0;border-radius:8px;margin-bottom:10px;" placeholder="Contraseña">
    <button onclick="pemGateSubmit()" style="width:100%;background:#16C270;color:#06140D;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">Entrar</button>
    <div id="pemGateError" style="color:#E8603D;font-size:12px;margin-top:10px;display:none;">Contraseña incorrecta</div>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem('pemAuthOK') === '1'){
    document.getElementById('pemGateOverlay').style.display = 'none';
  }
})();
async function pemGateSubmit(){
  const pw = document.getElementById('pemGatePw').value;
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if(hash === PEM_AUTH_HASH){
    sessionStorage.setItem('pemAuthOK','1');
    document.getElementById('pemGateOverlay').style.display = 'none';
  } else {
    document.getElementById('pemGateError').style.display = 'block';
  }
}
document.addEventListener('DOMContentLoaded', function(){
  var el = document.getElementById('pemGatePw');
  if(el) el.addEventListener('keydown', function(e){ if(e.key==='Enter') pemGateSubmit(); });
});
</script>

<div class="exec-nav">
  <button class="burger" id="pemBurger" aria-label="Abrir menú">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
  </button>
  <div class="wordmark">PEM <span>Excellence Academy</span></div>
</div>

  <div class="wrap">
    <div class="header">
      <div class="kicker">Comunicados</div>
      <h1>Noticias</h1>
      <div class="subtitle">Avisos, comunicados y actualizaciones de la plataforma.</div>
    </div>

    <section class="grid3" id="kpiGrid"></section>

    <div id="list"></div>
  </div>

<script>
const CATEGORY_META = {
  lanzamiento: {icon:'🚀', color:'#087F5B', bg:'#DFF3EA'},
  curso:       {icon:'📚', color:'#4D78B8', bg:'#E6EEF9'},
  mantenimiento:{icon:'🛠️', color:'#C7923E', bg:'#F8EDD9'},
  certificacion:{icon:'🎖', color:'#087F5B', bg:'#DFF3EA'},
  aviso:       {icon:'📣', color:'#C7923E', bg:'#F8EDD9'}
};

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d,10)} de ${meses[parseInt(m,10)-1]} de ${y}`;
}

function render(){
  const total = window.PEM_NOTICIAS ? PEM_NOTICIAS.length : 0;
  const lastDate = total ? formatDate(PEM_NOTICIAS[0].date) : '—';
  const categorias = total ? new Set(PEM_NOTICIAS.map(n=>n.category)).size : 0;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="card kpi"><div class="label">Avisos publicados</div><div class="value">${total}</div><div class="foot">Historial completo</div></div>
    <div class="card kpi"><div class="label">Categorías</div><div class="value">${categorias}</div><div class="foot">Tipos de comunicado</div></div>
    <div class="card kpi"><div class="label">Más reciente</div><div class="value" style="font-size:17px;">${lastDate}</div><div class="foot">Última publicación</div></div>
  `;

  const list = document.getElementById('list');
  if(!window.PEM_NOTICIAS || PEM_NOTICIAS.length === 0){
    list.innerHTML = `<div class="card empty">Todavía no hay avisos publicados.</div>`;
    return;
  }
  list.innerHTML = PEM_NOTICIAS.map(n=>{
    const meta = CATEGORY_META[n.category] || CATEGORY_META.aviso;
    return `<div class="card notice">
      <div class="ic" style="--nc:${meta.color};--nc-bg:${meta.bg}">${meta.icon}</div>
      <div class="notice-body">
        <div class="notice-date">${formatDate(n.date)}</div>
        <div class="notice-title">${n.title}</div>
        <div class="notice-text">${n.body}</div>
      </div>
    </div>`;
  }).join('');
}
render();

(function(){
  function syncNavHeight(){
    var nav = document.querySelector('.exec-nav');
    if(nav) document.documentElement.style.setProperty('--home-nav-h', nav.offsetHeight + 'px');
  }
  syncNavHeight();
  window.addEventListener('resize', syncNavHeight);
  window.addEventListener('DOMContentLoaded', syncNavHeight);
})();
</script>

<script src="assets/shell.js" defer></script>
</body>
</html>
