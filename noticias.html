<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias · PEM Excellence Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css?v=2">
<style>
  :root{
    --bg:#F5F6F3; --panel:#FFFFFF; --ink:#15201D; --muted:#68736F; --line:#E3E7E3;
    --green:#087F5B; --green2:#19A974; --mint:#DFF3EA;
    --blue:#4D78B8; --blueSoft:#E6EEF9;
    --gold:#C7923E; --goldSoft:#F8EDD9;
    --red:#C76A58; --redSoft:#F7E5E0;
    --shadow:0 8px 24px rgba(24,39,33,.07);
  }
  html[data-theme="dark"]{
    --bg:#040807; --panel:#0D1311; --ink:#FFFFFF; --muted:#8A9690; --line:#1D2622;
    --green:#22E88A; --green2:#5CFFB0; --mint:rgba(34,232,138,.14);
    --cyan:#3FE0E8;
    --blue:#4C9AFF; --blueSoft:rgba(76,154,255,.14);
    --gold:#FFB84D; --goldSoft:rgba(255,184,77,.14);
    --red:#FF6B6B; --redSoft:rgba(255,107,107,.14);
    --shadow:0 8px 32px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}

  body[data-pem-no-shell-header]{padding-top:var(--home-nav-h,64px) !important;}
  body[data-pem-no-shell-header] .pem-sidebar{top:var(--home-nav-h,64px) !important;height:calc(100vh - var(--home-nav-h,64px)) !important;}
  body[data-pem-no-shell-header] .pem-sidebar-brand{display:none;}
  .exec-nav{position:fixed;top:0;left:0;right:0;z-index:9500;display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);margin-left:calc(-1 * var(--pem-sb-w,0px));width:calc(100% + var(--pem-sb-w,0px));}
  .exec-nav .burger{display:none;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;color:var(--ink);cursor:pointer;}
  .exec-nav .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
  .exec-nav .wordmark span{color:var(--green);}
  .theme-toggle{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;}
  .theme-toggle:hover{border-color:var(--green);}
  @media(max-width:900px){
    .exec-nav{margin-left:0;width:100%;}
    .exec-nav .burger{display:inline-flex;}
  }

  .wrap{max-width:820px;margin:0 auto;padding:26px 28px 60px;}
  .header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .kicker{font-size:10.5px;letter-spacing:2px;color:var(--green);font-weight:800;text-transform:uppercase;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,3.4vw,34px);margin:6px 0 5px;letter-spacing:-.5px;}
  .subtitle{font-size:13.5px;color:var(--muted);max-width:700px;line-height:1.6;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);transition:.2s;}
  .card:hover{border-color:var(--green);transform:scale(1.035);box-shadow:0 14px 32px rgba(0,0,0,.55),0 0 0 1px rgba(34,232,138,.18),0 0 24px rgba(34,232,138,.14);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  .kpi{padding:17px 18px;}
  .kpi .label{font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:800;text-transform:uppercase;}
  .kpi .value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px;}
  .kpi .foot{font-size:11px;color:var(--muted);}

  .notice{display:flex;gap:16px;padding:20px 22px;margin-bottom:12px;position:relative;}
  .notice .ic{width:42px;height:42px;border-radius:11px;background:var(--nc-bg,var(--mint));color:var(--nc,var(--green));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .notice-body{flex:1;min-width:0;}
  .notice-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .notice-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;margin-bottom:6px;}
  .notice-text{color:var(--muted);font-size:13px;line-height:1.6;white-space:pre-line;}

  .empty{text-align:center;padding:60px 24px;color:var(--muted);}

  /* ---- Panel de administración ---- */
  .admin-toggle{background:var(--green);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;flex-shrink:0;}
  .admin-panel{display:none;padding:20px 22px;margin-bottom:22px;}
  .admin-panel.open{display:block;}
  .admin-panel h2{font-family:'Space Grotesk',sans-serif;font-size:14.5px;margin:0 0 14px;}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .admin-grid label{grid-column:span 2;font-size:11.5px;color:var(--muted);margin-bottom:-4px;}
  .admin-grid label.half{grid-column:span 1;}
  .admin-grid input, .admin-grid textarea, .admin-grid select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;}
  .admin-grid textarea{grid-column:span 2;min-height:80px;resize:vertical;}
  .admin-actions-row{grid-column:span 2;display:flex;gap:8px;margin-top:4px;}
  .admin-actions-row button{border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-save{background:var(--green);color:#fff;}
  .btn-cancel{background:var(--bg);color:var(--ink);border:1px solid var(--line) !important;}
  .admin-msg{grid-column:span 2;font-size:11.5px;}
  .admin-msg.err{color:var(--red);}
  .admin-msg.ok{color:var(--green);}

  .notice-admin-icons{position:absolute;top:14px;right:16px;display:flex;gap:6px;}
  .notice-admin-icons button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .notice-admin-icons button:hover{border-color:var(--green);color:var(--green);}
  .notice-admin-icons button.del:hover{border-color:var(--red);color:var(--red);}
  .notice-edit-form{padding:18px 20px;margin-bottom:12px;}

  @media(max-width:700px){
    .wrap{padding:18px 14px 50px;}
    .grid3{grid-template-columns:1fr;}
    .admin-grid{grid-template-columns:1fr;}
    .admin-grid label{grid-column:span 1;}
    .admin-grid textarea, .admin-actions-row, .admin-msg{grid-column:span 1;}
  }
</style>
</head>
<body data-pem-no-shell-header>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/pem-gate.js"></script>

<div class="exec-nav">
  <button class="burger" id="pemBurger" aria-label="Abrir menú">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
  </button>
  <div class="wordmark">PEM <span>Excellence Academy</span></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">🌙</button>
</div>

  <div class="wrap">
    <div class="header">
      <div>
        <div class="kicker">Comunicados</div>
        <h1>Noticias</h1>
        <div class="subtitle">Avisos, comunicados y actualizaciones de la plataforma.</div>
      </div>
      <button class="admin-toggle" id="adminToggle" style="display:none;">+ Publicar aviso</button>
    </div>

    <div class="card admin-panel" id="adminPanel">
      <h2>Publicar aviso nuevo</h2>
      <div class="admin-grid">
        <label class="half">Categoría
          <select id="fCategoria">
            <option value="lanzamiento">🚀 Lanzamiento</option>
            <option value="curso">📚 Curso</option>
            <option value="mantenimiento">🛠️ Mantenimiento</option>
            <option value="certificacion">🎖 Certificación</option>
            <option value="aviso" selected>📣 Aviso general</option>
          </select>
        </label>
        <label class="half">Fecha <input type="date" id="fFecha"></label>
        <label>Título <input id="fTitulo" placeholder="Título del aviso"></label>
        <label>Contenido <textarea id="fCuerpo" placeholder="Texto completo del aviso"></textarea></label>
        <div class="admin-actions-row">
          <button class="btn-save" id="btnPublicar">Publicar</button>
          <button class="btn-cancel" id="btnCancelarAlta" type="button">Cancelar</button>
        </div>
        <div class="admin-msg" id="adminMsg"></div>
      </div>
    </div>

    <section class="grid3" id="kpiGrid"></section>

    <div id="list"></div>
  </div>

<script>
const CATEGORY_META = {
  lanzamiento: {icon:'🚀', color:'#087F5B', bg:'#DFF3EA', label:'Lanzamiento'},
  curso:       {icon:'📚', color:'#4D78B8', bg:'#E6EEF9', label:'Curso'},
  mantenimiento:{icon:'🛠️', color:'#C7923E', bg:'#F8EDD9', label:'Mantenimiento'},
  certificacion:{icon:'🎖', color:'#087F5B', bg:'#DFF3EA', label:'Certificación'},
  aviso:       {icon:'📣', color:'#C7923E', bg:'#F8EDD9', label:'Aviso general'}
};

let NOTICIAS = [];
let IS_ADMIN = false;

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d,10)} de ${meses[parseInt(m,10)-1]} de ${y}`;
}

function noticeHtml(n){
  const meta = CATEGORY_META[n.categoria] || CATEGORY_META.aviso;
  const adminIcons = IS_ADMIN ? `
    <div class="notice-admin-icons">
      <button title="Editar" onclick="editNoticia('${n.id}')">✎</button>
      <button class="del" title="Eliminar" onclick="deleteNoticia('${n.id}')">🗑</button>
    </div>` : '';
  return `<div class="card notice" id="row-${n.id}">
    <div class="ic" style="--nc:${meta.color};--nc-bg:${meta.bg}">${meta.icon}</div>
    <div class="notice-body">
      <div class="notice-date">${formatDate(n.fecha)}</div>
      <div class="notice-title">${escapeHtml(n.titulo)}</div>
      <div class="notice-text">${escapeHtml(n.cuerpo)}</div>
    </div>
    ${adminIcons}
  </div>`;
}

function render(){
  const total = NOTICIAS.length;
  const lastDate = total ? formatDate(NOTICIAS[0].fecha) : '—';
  const categorias = total ? new Set(NOTICIAS.map(n=>n.categoria)).size : 0;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="card kpi"><div class="label">Avisos publicados</div><div class="value">${total}</div><div class="foot">Historial completo</div></div>
    <div class="card kpi"><div class="label">Categorías</div><div class="value">${categorias}</div><div class="foot">Tipos de comunicado</div></div>
    <div class="card kpi"><div class="label">Más reciente</div><div class="value" style="font-size:17px;">${lastDate}</div><div class="foot">Última publicación</div></div>
  `;

  const list = document.getElementById('list');
  if(!total){
    list.innerHTML = `<div class="card empty">Todavía no hay avisos publicados.</div>`;
    return;
  }
  list.innerHTML = NOTICIAS.map(noticeHtml).join('');
}

async function loadNoticias(){
  const { data, error } = await window.PEM_SB.from('noticias').select('*').order('fecha', { ascending: false }).order('created_at', { ascending: false });
  if(error){ console.warn('No se pudieron cargar las noticias:', error.message); return; }
  NOTICIAS = data || [];
  render();
}

async function checkAdmin(){
  try{
    const { data: { session } } = await window.PEM_SB.auth.getSession();
    if(!session) return;
    const { data: profile } = await window.PEM_SB.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
    IS_ADMIN = !!(profile && profile.is_admin);
    if(IS_ADMIN) document.getElementById('adminToggle').style.display = 'inline-block';
  }catch(e){ console.warn('No se pudo verificar admin:', e); }
}

// ==================== Alta de aviso ====================
document.getElementById('fFecha').valueAsDate = new Date();

document.getElementById('adminToggle').addEventListener('click', () => {
  document.getElementById('adminPanel').classList.toggle('open');
});
document.getElementById('btnCancelarAlta').addEventListener('click', () => {
  document.getElementById('adminPanel').classList.remove('open');
});

document.getElementById('btnPublicar').addEventListener('click', async () => {
  const msg = document.getElementById('adminMsg');
  const titulo = document.getElementById('fTitulo').value.trim();
  const cuerpo = document.getElementById('fCuerpo').value.trim();
  const categoria = document.getElementById('fCategoria').value;
  const fecha = document.getElementById('fFecha').value;
  if(!titulo || !cuerpo || !fecha){
    msg.textContent = 'Título, contenido y fecha son obligatorios.';
    msg.className = 'admin-msg err';
    return;
  }
  msg.textContent = 'Publicando…'; msg.className = 'admin-msg';

  const { error } = await window.PEM_SB.from('noticias').insert({ titulo, cuerpo, categoria, fecha });
  if(error){ msg.textContent = 'Error al publicar: ' + error.message; msg.className = 'admin-msg err'; return; }

  msg.textContent = '✓ Aviso publicado.'; msg.className = 'admin-msg ok';
  document.getElementById('fTitulo').value = '';
  document.getElementById('fCuerpo').value = '';
  document.getElementById('fFecha').valueAsDate = new Date();
  await loadNoticias();
});

// ==================== Editar / eliminar ====================
function editNoticia(id){
  const n = NOTICIAS.find(x => x.id === id);
  if(!n) return;
  const wrap = document.getElementById('row-' + id);
  wrap.outerHTML = `
    <div class="card notice-edit-form" id="row-${id}">
      <div class="admin-grid">
        <label class="half">Categoría
          <select id="e-cat-${id}">
            ${Object.keys(CATEGORY_META).map(k => `<option value="${k}" ${k===n.categoria?'selected':''}>${CATEGORY_META[k].icon} ${CATEGORY_META[k].label}</option>`).join('')}
          </select>
        </label>
        <label class="half">Fecha <input type="date" id="e-fecha-${id}" value="${n.fecha}"></label>
        <label>Título <input id="e-titulo-${id}" value="${escapeHtml(n.titulo)}"></label>
        <label>Contenido <textarea id="e-cuerpo-${id}">${escapeHtml(n.cuerpo)}</textarea></label>
        <div class="admin-actions-row">
          <button class="btn-save" onclick="saveNoticia('${id}')">Guardar</button>
          <button class="btn-cancel" onclick="render()">Cancelar</button>
        </div>
        <div class="admin-msg" id="e-msg-${id}"></div>
      </div>
    </div>`;
}

async function saveNoticia(id){
  const titulo = document.getElementById('e-titulo-'+id).value.trim();
  const cuerpo = document.getElementById('e-cuerpo-'+id).value.trim();
  const categoria = document.getElementById('e-cat-'+id).value;
  const fecha = document.getElementById('e-fecha-'+id).value;
  const { error } = await window.PEM_SB.from('noticias').update({ titulo, cuerpo, categoria, fecha }).eq('id', id);
  const msg = document.getElementById('e-msg-'+id);
  if(error){ msg.textContent = error.message; msg.className = 'admin-msg err'; return; }
  await loadNoticias();
}

async function deleteNoticia(id){
  if(!confirm('¿Eliminar este aviso? No se puede deshacer.')) return;
  const { error } = await window.PEM_SB.from('noticias').delete().eq('id', id);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  await loadNoticias();
}

(async function(){
  await checkAdmin();
  await loadNoticias();
})();

(function(){
  function syncNavHeight(){
    var nav = document.querySelector('.exec-nav');
    if(nav) document.documentElement.style.setProperty('--home-nav-h', nav.offsetHeight + 'px');
  }
  syncNavHeight();
  window.addEventListener('resize', syncNavHeight);
  window.addEventListener('DOMContentLoaded', syncNavHeight);
})();
</script>

<script>
(function(){
  var btn = document.getElementById('themeToggle');
  if(!btn) return;
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function updateBtn(){
    if(isDark()){
      btn.textContent = '☀️';
      btn.setAttribute('aria-label','Cambiar a modo claro');
      btn.setAttribute('title','Cambiar a modo claro');
    } else {
      btn.textContent = '🌙';
      btn.setAttribute('aria-label','Cambiar a modo oscuro');
      btn.setAttribute('title','Cambiar a modo oscuro');
    }
  }
  updateBtn();
  btn.addEventListener('click', function(){
    if(isDark()){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('pemTheme','light');
    } else {
      document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('pemTheme','dark');
    }
    updateBtn();
  });
})();
</script>
<script src="assets/shell.js?v=2" defer></script>
</body>
</html>
