<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 1 · ISO 9001</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css?v=3">
<style>
  :root{
    --bg:#F3F1EC;
    --surface:#FFFFFF;
    --surface-2:#ECE8E0;
    --line:#E4DFD4;
    --green:#0B7A4B;
    --green-dim:#E3F0E9;
    --amber:#A9720F;
    --text:#1C1A16;
    --muted:#6B655A;
    --bad:#932A2A;
  }
  html[data-theme="dark"]{
    --bg:#070B0A;
    --surface:#0D1311;
    --surface-2:#141B18;
    --line:#24302B;
    --green:#22E88A;
    --green-dim:#0B3D28;
    --amber:#FF7A1A;
    --text:#FFFFFF;
    --muted:#AAB5AF;
    --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(22,194,112,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--green);
    display:flex;align-items:center;gap:8px;
    margin-bottom:10px;
  }
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(24px,5vw,32px);
    font-weight:700;
    margin:0 0 6px;
    line-height:1.15;
  }
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{
    height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;
  }
  .progress-fill{height:100%;background:var(--green);width:0%;transition:width .35s ease;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 24px;
    margin-bottom:16px;
  }
  .qnum{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;
  }
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    margin-bottom:10px;cursor:pointer;transition:.15s;
    background:var(--surface-2);
  }
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--green);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--green);background:rgba(22,194,112,0.08);}

  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    border:none;border-radius:10px;padding:13px 22px;cursor:pointer;
    transition:.15s;
  }
  .btn-primary{background:var(--green);color:#06140D;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}

  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:'Space Grotesk',sans-serif;font-weight:700;
  }
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;
    font-size:13.5px;background:var(--surface-2);
  }
  .review-item.correct{border-left:3px solid var(--green);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/pem-gate.js"></script>




<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Calidad</div>
  <h1>Módulo 1 — Fundamentos ISO 9001</h1>
  <div class="sub">10 reactivos · aprobatorio 80% · sin límite de tiempo</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quiz"></div>

  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>

  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#16C270" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>

  <footer>PEM-EXAM-9001-M1 · Production Enhancement México</footer>
</div>

<script>
const ALL_QUESTIONS = [
  {
    q: "Un compresor presenta la misma falla tres veces en el mismo trimestre, en tres bases distintas. Según el enfoque a procesos de ISO 9001, ¿cuál es la causa más probable?",
    options: [
      "El mismo operador cometió el mismo error en las tres bases",
      "Un problema del sistema (diseño del proceso, mantenimiento o control), no un error aislado de una persona",
      "Es una coincidencia estadística sin relevancia para el sistema de gestión",
      "Corresponde investigarlo solo si el cliente lo solicita expresamente"
    ],
    correct: 1
  },
  {
    q: "En PEM, la calidad según ISO 9001 se entiende principalmente como:",
    options: [
      "Cumplir el mayor número de requisitos documentales posible",
      "Lograr cero quejas del cliente en el reporte mensual",
      "Que la operación sea predecible y confiable, no accidental",
      "Una responsabilidad exclusiva del área de Calidad, no de cada colaborador"
    ],
    correct: 2
  },
  {
    q: "El ciclo PHVA (Planificar-Hacer-Verificar-Actuar) aplicado a la operación de un compresor reciprocante significa:",
    options: [
      "Planificar el mantenimiento, operar, verificar parámetros contra especificación, y actuar corrigiendo desviaciones",
      "Aplica solo a la documentación del sistema de gestión, no a la operación diaria en campo",
      "Es responsabilidad exclusiva del gerente de planta, no del operador de campo",
      "Sustituye a las bitácoras de operación una vez implementado"
    ],
    correct: 0
  },
  {
    q: "¿Qué significa 'contexto de la organización' en ISO 9001 para PEM?",
    options: [
      "La estructura jerárquica y el organigrama vigente de la empresa",
      "Los factores internos y externos (clientes como PEMEX/CFE, normativa, condiciones de campo, capacidades técnicas) que afectan la capacidad de PEM para entregar el servicio",
      "El resumen de auditorías y hallazgos de los últimos tres años",
      "El presupuesto anual asignado a cada base de operación"
    ],
    correct: 1
  },
  {
    q: "¿Cuál de las siguientes es una parte interesada (stakeholder) relevante para el Sistema de Gestión de Calidad de PEM?",
    options: [
      "Únicamente PEMEX, por ser el cliente con mayor volumen de contratos",
      "Solamente las autoridades regulatorias que auditan a PEM",
      "Clientes (PEMEX, CFE, Operadoras), autoridades regulatorias, empleados y proveedores críticos",
      "Exclusivamente los organismos certificadores que emiten el certificado ISO"
    ],
    correct: 2
  },
  {
    q: "Un operador detecta que la presión de descarga de un compresor está fuera de rango y lo reporta de inmediato siguiendo el procedimiento, aunque eso implique detener el equipo. Esto es un ejemplo de:",
    options: [
      "Una decisión que debió consultarse primero con el supervisor antes de actuar",
      "Aplicación correcta del enfoque a procesos y control operacional",
      "Pérdida de producción que debe evitarse a toda costa",
      "Un procedimiento que solo aplica a equipos críticos, no a todos los compresores"
    ],
    correct: 1
  },
  {
    q: "¿Por qué ISO 9001 le importa a un mecánico o técnico de campo, y no solo a Calidad?",
    options: [
      "Porque debe firmar los documentos del sistema de gestión cada mes",
      "Porque cada tarea de campo (torque correcto, registro de mantenimiento, reporte de anomalías) es parte del proceso que sostiene la certificación y la confiabilidad ante el cliente",
      "Porque el auditor externo entrevista directamente a los técnicos una vez al año",
      "Porque su desempeño se evalúa exclusivamente con base en el cumplimiento documental"
    ],
    correct: 1
  },
  {
    q: "Una 'no conformidad' en el SGC de PEM es:",
    options: [
      "Un reporte que solo se genera cuando lo detecta un auditor externo",
      "Un desvío respecto a un requisito (procedimiento, especificación del cliente o norma) que debe identificarse y corregirse",
      "Una sanción que se aplica al responsable del área involucrada",
      "Un registro que aplica únicamente a procesos documentales, no operativos"
    ],
    correct: 1
  },
  {
    q: "PEM opera en Reynosa, Villahermosa, Poza Rica, CDMX y Monterrey. ¿Por qué esto es relevante para el SGC?",
    options: [
      "Cada base puede definir sus propios criterios de calidad según su experiencia local",
      "Es relevante únicamente para la logística de traslado de personal",
      "El sistema debe garantizar que el mismo estándar de calidad y control operacional se aplique de forma consistente en los sitios de trabajo",
      "El sistema de gestión solo aplica a la base con mayor volumen de operación"
    ],
    correct: 2
  },
  {
    q: "El objetivo final de este Módulo 1 es que el colaborador de PEM entienda que ISO 9001:",
    options: [
      "Es un conjunto de lineamientos que aplica principalmente al personal administrativo",
      "Es una herramienta operativa que hace que el trabajo diario en campo sea más confiable, seguro y predecible para el cliente y para PEM",
      "Es un requisito que se cumple una vez al año durante la auditoría de certificación",
      "Es responsabilidad exclusiva de la Dirección General mantenerlo vigente"
    ],
    correct: 1
  },
  {
    q: "¿Qué elementos debe considerar PEM al determinar el alcance de su Sistema de Gestión de Calidad (cláusula 4.3)?",
    options: [
      "Únicamente los servicios que factura directamente a PEMEX",
      "Los productos y servicios que ofrece, las partes interesadas relevantes, y los requisitos aplicables a su operación",
      "Solo las bases donde ya se realizó una auditoría externa",
      "Exclusivamente los procesos que involucran documentación física"
    ],
    correct: 1
  },
  {
    q: "Según la cláusula 4.4 de ISO 9001, un 'proceso' dentro del SGC de PEM se entiende como:",
    options: [
      "Cualquier actividad que quede registrada en un formato oficial",
      "Un conjunto de actividades relacionadas que transforman entradas en salidas, con secuencia e interacción definidas con otros procesos",
      "Una tarea que solo existe si está descrita en el manual de calidad",
      "Un trámite administrativo que no afecta directamente a la operación de campo"
    ],
    correct: 1
  },
  {
    q: "Un cliente exige evidencia de que PEM identifica y gestiona los riesgos de cada proceso operativo. Esto corresponde a:",
    options: [
      "Un requisito exclusivo de ISO 45001, no de ISO 9001",
      "Una práctica opcional que solo aplica si el cliente lo pide por escrito",
      "El enfoque basado en riesgos que exige la cláusula 4.4, integrado al Sistema de Gestión de Calidad",
      "Un proceso independiente que no forma parte del SGC"
    ],
    correct: 2
  },
  {
    q: "¿Cuál de las siguientes describe mejor una 'parte interesada' según la cláusula 4.2?",
    options: [
      "Únicamente quien firma el contrato de servicios con PEM",
      "Solamente el personal que trabaja directamente en la base de operación",
      "Cualquier institución gubernamental, sin importar si tiene relación con PEM",
      "Cualquier persona u organización que puede afectar, verse afectada, o percibirse afectada por una decisión o actividad de PEM"
    ],
    correct: 3
  },
  {
    q: "PEM presta servicios a PEMEX, CFE y operadoras privadas en distintas condiciones de campo. Bajo la cláusula 4.1, esto significa que PEM debe:",
    options: [
      "Aplicar exactamente el mismo procedimiento operativo sin ajustes, sin importar el cliente",
      "Identificar y dar seguimiento a los factores internos y externos que cambian según el cliente y el sitio, ya que afectan su capacidad de cumplir el servicio",
      "Delegar por completo esa evaluación al cliente, ya que es su responsabilidad",
      "Actualizar el contexto de la organización solo cuando se renueva la certificación"
    ],
    correct: 1
  }
];

function pickQuestions(pool, n){
  var idx = pool.map(function(_,i){ return i; });
  for(var i=idx.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=idx[i]; idx[i]=idx[j]; idx[j]=t;
  }
  return idx.slice(0, n).map(function(i){ return pool[i]; });
}
const QUESTIONS = pickQuestions(ALL_QUESTIONS, 10);

(function shuffleOptions(){
  QUESTIONS.forEach(function(q){
    var idx = q.options.map(function(_,i){ return i; });
    for(var i=idx.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=idx[i]; idx[i]=idx[j]; idx[j]=t;
    }
    q.options = idx.map(function(i){ return q.options[i]; });
    q.correct = idx.indexOf(q.correct);
  });
})();

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}

function selectOpt(i){
  answers[current]=i;
  renderQ();
}

function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){
    current++;
    renderQ();
  } else {
    finish();
  }
}
function prevQ(){
  if(current>0){current--;renderQ();}
}

function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';

  let correct = 0;
  QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.correct) correct++; });
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;

  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok && pass?`<div style="margin-top:8px;color:#16C270;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
      ${!ok && !pass?`<div style="margin-top:8px;color:var(--muted);font-style:italic;">Revisa el video y las flashcards de este módulo antes de reintentar.</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;

  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 1. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }

  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{
    document.getElementById('gaugeArc').style.strokeDashoffset = offset;
  },100);
}

renderQ();
</script>
<script src="assets/shell.js?v=3" defer></script>
</body>
</html>
