<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 11 · ISO 37001</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/shell.css?v=3">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#E4DFD4;
    --red:#932A2A; --amber:#A9720F; --text:#1C1A16; --muted:#6B655A; --bad:#932A2A;
  }
  html[data-theme="dark"]{
    --bg:#070B0A; --surface:#0D1311; --surface-2:#141B18; --line:#24302B;
    --red:#E8603D; --amber:#FF7A1A; --text:#FFFFFF; --muted:#AAB5AF; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(232,96,61,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--red);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--red);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--red);background:rgba(232,96,61,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--red);color:#1A0A05;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--red);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--red);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/pem-gate.js"></script>




<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Ética y Cumplimiento</div>
  <h1>Módulo 11 — Comunicación, Competencia y Conciencia</h1>
  <div class="sub">ISO 37001 Cl. 7 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#E8603D" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-37001-M11 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Un colaborador de Compras, área identificada como de alto riesgo desde el Módulo 4, nunca ha recibido capacitación específica sobre el sistema antisoborno de PEM. Según Cl. 7, esto representa:",
    options: [
      "Una situación que resulta normal, siempre y cuando el colaborador conozca las reglas generales de la empresa",
      "Una brecha de competencia: PEM debe asegurar formación específica para el personal en roles de mayor riesgo",
      "Un tema que en realidad solamente le corresponde atender a Recursos Humanos, sin relación con el SGAS",
      "Algo que en la práctica termina resolviéndose de forma automática con la antigüedad del colaborador"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 7, la 'toma de conciencia' que PEM debe asegurar en sus colaboradores incluye que comprendan:",
    options: [
      "Únicamente el organigrama vigente correspondiente a la Función Antisoborno de la empresa PEM",
      "La política antisoborno, su contribución a la eficacia del sistema, y las implicaciones de no cumplirla",
      "Solamente los datos financieros generales de la empresa correspondientes al periodo evaluado",
      "Exclusivamente las sanciones legales que resultan aplicables en otros países distintos a México"
    ],
    correct: 1
  },
  {
    q: "La competencia exigida por Cl. 7 para la Función Antisoborno y para el personal en roles de alto riesgo (como Compras) debe ser:",
    options: [
      "Exactamente la misma para todos los puestos de PEM, sin que exista ninguna distinción real entre ellos",
      "Proporcional al nivel de exposición al riesgo de cada rol, con mayor profundidad para las áreas de mayor riesgo",
      "Definida una única vez, exactamente en el momento de certificar el sistema por primera vez",
      "Una responsabilidad exclusiva de cada colaborador, sin que exista ningún programa formal por parte de PEM"
    ],
    correct: 1
  },
  {
    q: "¿Qué debe incluir la comunicación interna del SGAS, según Cl. 7, además de la política antisoborno?",
    options: [
      "Solamente el organigrama general correspondiente a la estructura completa de la empresa PEM",
      "Información relevante como el canal de denuncias, los roles definidos, y actualizaciones importantes del sistema",
      "Únicamente los resultados financieros correspondientes al trimestre evaluado dentro de la empresa",
      "Solamente información que resulta dirigida de forma exclusiva a la Dirección General de PEM"
    ],
    correct: 1
  },
  {
    q: "¿Por qué la comunicación EXTERNA del SGAS —hacia proveedores, clientes y otras partes interesadas— también es relevante según Cl. 7?",
    options: [
      "En realidad no lo es, ya que la comunicación del SGAS solamente debe llegar a ser de carácter interno",
      "Porque terceros que interactúan con PEM también deben conocer el estándar de integridad que la empresa exige",
      "Porque la ley, según su redacción, exige publicar el SGAS completo dentro de medios de comunicación públicos",
      "Porque, en la práctica, esta comunicación reemplaza por completo la necesidad de cláusulas contractuales antisoborno"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta este módulo con el liderazgo y la Función Antisoborno vistos en el Módulo 2?",
    options: [
      "No guarda ninguna relación real; se trata de requisitos que resultan completamente independientes entre sí",
      "El liderazgo del Módulo 2 asegura los recursos; este módulo convierte esos recursos en competencia y conciencia real",
      "Este módulo, en la práctica, termina reemplazando por completo la necesidad de un liderazgo real dentro de PEM",
      "Solamente llegan a relacionarse entre sí en el caso de que el mismo comité redacte ambos contenidos por igual"
    ],
    correct: 1
  },
  {
    q: "Si PEM capacita a sus colaboradores una sola vez, al momento de su contratación, sin ninguna actualización posterior, esto representa un riesgo porque:",
    options: [
      "Ningún riesgo real, ya que en la práctica la capacitación inicial siempre resulta suficiente para toda la carrera del colaborador",
      "El contexto de riesgo y la política pueden cambiar con el tiempo, y una capacitación única no refleja esos cambios",
      "Es un tema que resulta exclusivo de Recursos Humanos, sin ninguna relación real con la eficacia del SGAS",
      "Se termina resolviendo de forma automática siempre que el colaborador llegue a leer la política una sola vez"
    ],
    correct: 1
  },
  {
    q: "¿Por qué la toma de conciencia debe evaluarse (por ejemplo, con un examen como el de este módulo) y no solo asumirse tras compartir la información?",
    options: [
      "No resulta necesario evaluarla en realidad, ya que compartir la información siempre garantiza que se llegó a comprender",
      "Porque evaluar permite verificar que la comprensión real ocurrió, en vez de asumir que la exposición fue suficiente",
      "Porque, en la práctica, la evaluación correspondiente termina reemplazando la necesidad de aplicar la política real",
      "Porque esta evaluación, según la norma, solamente se llega a aplicar al personal de nuevo ingreso a la empresa"
    ],
    correct: 1
  },
  {
    q: "El registro de las capacitaciones y evaluaciones de conciencia antisoborno realizadas por cada colaborador sirve, entre otras cosas, para:",
    options: [
      "Solamente llenar un archivo de tipo administrativo, sin que exista ningún otro uso real más allá de eso",
      "Demostrar, ante una auditoría interna o externa, que el SGAS realmente construye competencia dentro de la organización",
      "Sustituir por completo, en la práctica, la necesidad real de contar con una política antisoborno formal",
      "Únicamente justificar el presupuesto anual que se le asigna al área de capacitación dentro de PEM"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 11 es que cada colaborador de PEM entienda que comunicación, competencia y conciencia antisoborno:",
    options: [
      "Son tres requisitos de tipo administrativo, sin que exista ninguna relación real entre ellos dentro del sistema",
      "Trabajan juntos para que el sistema antisoborno no dependa solo de documentos, sino de personas que realmente entienden su rol",
      "Solamente resultan aplicables al personal que acaba de ingresar recientemente a trabajar en la empresa PEM",
      "Se resuelven de forma automática siempre que exista una política antisoborno debidamente firmada por Dirección"
    ],
    correct: 1
  }
];
(function shuffleOptions(){
  QUESTIONS.forEach(function(q){
    var idx = q.options.map(function(_,i){ return i; });
    for(var i=idx.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=idx[i]; idx[i]=idx[j]; idx[j]=t;
    }
    q.options = idx.map(function(i){ return q.options[i]; });
    q.correct = idx.indexOf(q.correct);
  });
})();

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.correct) correct++; });
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok && pass?`<div style="margin-top:8px;color:#E8603D;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
      ${!ok && !pass?`<div style="margin-top:8px;color:var(--muted);font-style:italic;">Revisa el video y las flashcards de este módulo antes de reintentar.</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 11. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
<script src="../assets/shell.js?v=3" defer></script>
</body>
</html>
