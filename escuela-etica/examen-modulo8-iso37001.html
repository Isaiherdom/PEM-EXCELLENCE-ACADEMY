<!DOCTYPE html>

<script>try{if(localStorage.getItem('pemTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 8 · ISO 37001</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --bg:#0B0E0C; --surface:#141815; --surface-2:#1B211D; --line:#26302A;
    --red:#E8603D; --amber:#E8A33D; --text:#F1F3F0; --muted:#8A968E; --bad:#E8603D;
  }
  html[data-theme="light"]{--bg:#FFFFFF;--surface:#F5F6F4;--surface-2:#ECEFEA;--line:#DDE3DE;--text:#14181A;--muted:#5C665F;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(232,96,61,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--red);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--red);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--red);background:rgba(232,96,61,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--red);color:#1A0A05;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--red);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--red);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>

.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#0B1712;border:1.5px solid #16C270;color:#2CFF9B;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 0 16px rgba(22,194,112,.45),0 4px 14px rgba(0,0,0,.4);transition:.15s;}
.pem-home-btn:hover{background:#16C270;color:#06140D;box-shadow:0 0 22px rgba(22,194,112,.7),0 4px 14px rgba(0,0,0,.4);}
.pem-home-btn svg{flex-shrink:0;}

@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Ética y Cumplimiento</div>
  <h1>Módulo 8 — Compromisos Antisoborno de Terceros</h1>
  <div class="sub">ISO 37001 Cl. 8.7 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#E8603D" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-37001-M8 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "PEM formaliza un contrato con un proveedor de bajo riesgo (por ejemplo, papelería de oficina) exigiéndole el mismo compromiso antisoborno extenso que a un agente comercial de alto riesgo. Según Cl. 8.7, esto representa:",
    options: [
      "Una práctica correcta, mientras más exigencia siempre es mejor",
      "Un desajuste de proporcionalidad: el compromiso exigido debe ser proporcional al riesgo identificado en el Módulo 4, no aplicarse de forma idéntica a todos los terceros",
      "Un requisito exclusivo de proveedores extranjeros",
      "Algo sin relación con la debida diligencia del Módulo 5"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.7, PEM debe obtener de sus socios de negocio, cuando el riesgo lo justifique:",
    options: [
      "Únicamente una firma en el contrato comercial general, sin mención específica al soborno",
      "Un compromiso explícito de cumplir con estándares antisoborno equivalentes a los de PEM, proporcional al nivel de riesgo de la relación",
      "Solo una declaración verbal, sin ningún registro formal",
      "Un pago de garantía en caso de incumplimiento, sin más compromiso"
    ],
    correct: 1
  },
  {
    q: "Un agente comercial de alto riesgo que firma un compromiso antisoborno formal como parte de su contrato con PEM, pero nunca recibe ninguna capacitación ni referencia posterior a ese compromiso, representa:",
    options: [
      "Un cumplimiento suficiente de la Cl. 8.7, ya que el documento existe",
      "El mismo riesgo de 'compromiso de papel' visto en otras escuelas: un documento firmado que nunca se refuerza ni se verifica en la práctica",
      "Una situación sin relación con el sistema antisoborno",
      "Algo que solo debe corregirse si el agente comete una falta"
    ],
    correct: 1
  },
  {
    q: "¿Por qué es razonable que PEM aplique un nivel más ligero de compromiso formal a un proveedor de bajo riesgo, como uno de suministros de oficina?",
    options: [
      "Porque los proveedores de bajo riesgo nunca representan ningún riesgo real",
      "Porque exigir el mismo nivel de compromiso extenso a todos los terceros desperdicia recursos de verificación donde no se necesitan, sin mejorar realmente la prevención del riesgo real",
      "Porque la norma prohíbe pedir compromisos a proveedores de bajo riesgo",
      "Porque el nivel de compromiso no tiene relación con el riesgo evaluado"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta el compromiso antisoborno de terceros (Cl. 8.7) con la cláusula contractual vista en el Módulo 5?",
    options: [
      "No tiene relación, son requisitos completamente distintos",
      "La cláusula contractual del Módulo 5 es precisamente uno de los mecanismos concretos para formalizar el compromiso que exige la Cl. 8.7 — ambos trabajan juntos, no por separado",
      "El compromiso de la Cl. 8.7 reemplaza la necesidad de cualquier cláusula contractual",
      "Solo se relacionan si el tercero opera fuera de México"
    ],
    correct: 1
  },
  {
    q: "Si un socio de negocio de PEM se niega explícitamente a aceptar un compromiso antisoborno razonable, proporcional a su nivel de riesgo, esto debería:",
    options: [
      "Ignorarse si el socio ofrece condiciones comerciales muy favorables",
      "Tratarse como una señal de alerta relevante para la decisión de continuar o no la relación comercial, dado que la negativa en sí misma es información sobre el riesgo real",
      "Resolverse solo con una advertencia verbal, sin ninguna otra consecuencia",
      "Un tema que no debe influir en absoluto en la decisión comercial"
    ],
    correct: 1
  },
  {
    q: "El compromiso antisoborno de un socio de negocio (Cl. 8.7) debe ser, idealmente:",
    options: [
      "Genérico y aplicado exactamente igual a cualquier tipo de relación comercial",
      "Específico y proporcional, considerando el tipo de relación, el nivel de riesgo, y las actividades concretas que el tercero realizará en representación o beneficio de PEM",
      "Solicitado solo después de que ocurra un incidente con ese tercero",
      "Un documento que PEM redacta sin ninguna revisión legal"
    ],
    correct: 1
  },
  {
    q: "¿Por qué obtener compromisos antisoborno de terceros no sustituye la necesidad de la debida diligencia vista en el Módulo 5?",
    options: [
      "Porque en realidad sí la sustituye completamente",
      "Porque un compromiso firmado es una declaración de intención; la debida diligencia es la verificación activa de que ese tercero realmente merece la confianza que se le está otorgando",
      "Porque la debida diligencia solo aplica a proveedores, no a socios comerciales",
      "Porque los compromisos firmados garantizan automáticamente el cumplimiento"
    ],
    correct: 1
  },
  {
    q: "Un distribuidor que actúa en nombre de PEM ante un cliente extranjero acepta formalmente el compromiso antisoborno de PEM. ¿Qué debería pasar si, meses después, PEM detecta que el distribuidor incumplió ese compromiso?",
    options: [
      "Nada, mientras el incumplimiento no afecte directamente a PEM",
      "Debe evaluarse conforme a lo establecido en el compromiso —que puede incluir desde acciones correctivas hasta la terminación de la relación—, y considerarse en la investigación de incidentes vista más adelante en esta escuela",
      "Solo debe documentarse, sin ninguna acción real",
      "PEM no tiene ninguna responsabilidad, ya que el incumplimiento fue del distribuidor"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 8 es que cada colaborador de PEM entienda que los compromisos antisoborno de terceros:",
    options: [
      "Son un trámite legal uniforme que se aplica igual a cualquier tercero",
      "Formalizan, de manera proporcional al riesgo, el estándar de integridad que PEM exige a quienes actúan en su nombre o se relacionan comercialmente con la empresa, complementando —no sustituyendo— la debida diligencia real",
      "Solo se solicitan a terceros extranjeros",
      "Se resuelven automáticamente con la firma del contrato comercial general"
    ],
    correct: 1
  }
];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    if(ok) correct++;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok?`<div style="margin-top:8px;color:#E8603D;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
    </div>`;
  }).join('');
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 8. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
</body>
</html>
