<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 6 · ISO 37001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E0C; --surface:#141815; --surface-2:#1B211D; --line:#26302A;
    --red:#E8603D; --amber:#E8A33D; --text:#F1F3F0; --muted:#8A968E; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(232,96,61,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--red);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--red);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--red);background:rgba(232,96,61,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--red);color:#1A0A05;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--red);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--red);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<a href="../index.html" class="pem-home-btn" aria-label="Volver al inicio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Inicio</a>
<style>
.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#0B1712;border:1.5px solid #16C270;color:#2CFF9B;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 0 16px rgba(22,194,112,.45),0 4px 14px rgba(0,0,0,.4);transition:.15s;}
.pem-home-btn:hover{background:#16C270;color:#06140D;box-shadow:0 0 22px rgba(22,194,112,.7),0 4px 14px rgba(0,0,0,.4);}
.pem-home-btn svg{flex-shrink:0;}
@media print{.pem-home-btn{display:none !important;}}
@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Ética y Cumplimiento</div>
  <h1>Módulo 6 — Controles Financieros y No Financieros</h1>
  <div class="sub">ISO 37001 Cl. 8.3–8.4 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#E8603D" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-37001-M6 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "En una base de PEM, la misma persona solicita, aprueba y paga una factura de un proveedor, sin ninguna otra revisión. Según Cl. 8.3, esto representa:",
    options: [
      "Una práctica eficiente que agiliza los pagos",
      "Ausencia de segregación de funciones: un control financiero básico exige que solicitar, aprobar y pagar sean funciones separadas, para reducir la posibilidad de manipular un pago indebido",
      "Un tema sin relación con el riesgo de soborno",
      "Algo que solo importa si el monto es muy alto"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.3, los controles financieros que PEM debe implementar incluyen, entre otros:",
    options: [
      "Únicamente un límite máximo de gasto por colaborador",
      "Segregación de funciones en pagos, revisión y aprobación de transacciones, y registros contables que reflejen con exactitud la naturaleza de cada transacción",
      "Solo la firma del Director General en cada transacción, sin importar el monto",
      "Exclusivamente controles aplicados a transacciones en moneda extranjera"
    ],
    correct: 1
  },
  {
    q: "Un registro contable que describe un pago como 'gastos de representación' cuando en realidad correspondió a un regalo de alto valor para un funcionario, representa:",
    options: [
      "Una práctica contable aceptable si el monto es menor",
      "Exactamente el tipo de registro inexacto que la Cl. 8.3 busca prevenir: los registros deben reflejar la naturaleza real de cada transacción, no una descripción conveniente",
      "Un tema que solo le corresponde revisar al auditor externo anual",
      "Algo sin relación con el sistema antisoborno"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.4, los controles NO financieros que PEM debe aplicar incluyen, por ejemplo:",
    options: [
      "Únicamente controles relacionados con efectivo en caja chica",
      "Procesos de compras y contratación de personal que verifiquen antecedentes e integridad antes de formalizar una relación, no solo controles sobre dinero",
      "Solo controles aplicables al área de Finanzas",
      "Exclusivamente auditorías contables anuales"
    ],
    correct: 1
  },
  {
    q: "El Procedimiento de Verificación de Antecedentes que PEM aplica antes de contratar personal es un ejemplo de:",
    options: [
      "Un control financiero, ya que involucra el pago de nómina",
      "Un control NO financiero (Cl. 8.4): reduce el riesgo de incorporar a alguien con antecedentes de integridad comprometidos, sin que el control dependa de dinero o pagos",
      "Un trámite exclusivo de Recursos Humanos sin relación con el SGAS",
      "Un requisito que solo aplica a puestos directivos"
    ],
    correct: 1
  },
  {
    q: "¿Por qué la segregación de funciones es un control especialmente importante en Compras y Finanzas, las áreas identificadas como de mayor riesgo en el Módulo 4?",
    options: [
      "No es más importante ahí que en cualquier otra área",
      "Porque son precisamente las áreas donde una sola persona con control total sobre una transacción tiene mayor capacidad de manipular un pago o una selección de proveedor a cambio de un beneficio indebido",
      "Porque la ley exige segregación de funciones solo en esas dos áreas",
      "Porque Compras y Finanzas tienen menos personal que otras áreas"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta este módulo con la evaluación de riesgo del Módulo 4 y la debida diligencia del Módulo 5?",
    options: [
      "No tiene relación, son procesos completamente independientes",
      "Los controles financieros y no financieros son la forma concreta de gestionar el riesgo identificado y reforzar la debida diligencia aplicada, con mecanismos verificables en la operación diaria",
      "Los controles financieros reemplazan la necesidad de evaluar riesgo o aplicar debida diligencia",
      "Solo se relacionan si ocurre una auditoría externa"
    ],
    correct: 1
  },
  {
    q: "Un pago en efectivo, sin factura ni registro contable claro, realizado para 'agilizar' un trámite regulatorio, representa:",
    options: [
      "Una práctica aceptable si el monto es pequeño",
      "Una señal de alerta grave: la ausencia de un registro contable exacto es exactamente el tipo de vacío que un control financiero (Cl. 8.3) busca cerrar",
      "Un tema sin relación con el sistema antisoborno de PEM",
      "Algo que solo debe revisarse si el trámite fracasa"
    ],
    correct: 1
  },
  {
    q: "¿Por qué los controles no financieros (como la verificación de antecedentes en RH) son igual de importantes que los controles financieros dentro del SGAS?",
    options: [
      "No lo son, los controles financieros son siempre más importantes",
      "Porque el riesgo de soborno no solo se materializa a través de dinero: decisiones de contratación, selección de proveedores o adjudicación de contratos también pueden verse comprometidas sin que haya un pago directo de por medio",
      "Porque la norma solo exige controles no financieros, nunca financieros",
      "Porque los controles no financieros son más fáciles de implementar"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 6 es que cada colaborador de PEM entienda que los controles financieros y no financieros:",
    options: [
      "Son responsabilidad exclusiva del área de Finanzas y Recursos Humanos",
      "Son los mecanismos concretos y verificables que convierten la política y la evaluación de riesgo en prevención real, tanto en el manejo del dinero como en decisiones que no involucran pagos directos",
      "Solo se aplican a transacciones de montos muy altos",
      "Se resuelven automáticamente si existe una auditoría externa anual"
    ],
    correct: 1
  }
];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    if(ok) correct++;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok?`<div style="margin-top:8px;color:#E8603D;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
    </div>`;
  }).join('');
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 6. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
</body>
</html>
