<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 7 · ISO 37001</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --bg:#0B0E0C; --surface:#141815; --surface-2:#1B211D; --line:#26302A;
    --red:#E8603D; --amber:#E8A33D; --text:#F1F3F0; --muted:#8A968E; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(232,96,61,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--red);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--red);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--red);background:rgba(232,96,61,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--red);color:#1A0A05;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--red);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--red);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<a href="../index.html" class="pem-home-btn" aria-label="Volver al inicio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Inicio</a>
<style>
.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#0B1712;border:1.5px solid #16C270;color:#2CFF9B;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 0 16px rgba(22,194,112,.45),0 4px 14px rgba(0,0,0,.4);transition:.15s;}
.pem-home-btn:hover{background:#16C270;color:#06140D;box-shadow:0 0 22px rgba(22,194,112,.7),0 4px 14px rgba(0,0,0,.4);}
.pem-home-btn svg{flex-shrink:0;}
@media print{.pem-home-btn{display:none !important;}}
@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Ética y Cumplimiento</div>
  <h1>Módulo 7 — Regalos, Hospitalidad, Donativos y Beneficios</h1>
  <div class="sub">ISO 37001 Cl. 8.5–8.6 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#E8603D" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-37001-M7 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Retomando el caso del Módulo 1: un proveedor le ofrece a un colaborador de Compras una cena costosa y un regalo personal justo antes de aprobar una orden de compra. Según Cl. 8.6, lo correcto era:",
    options: [
      "Aceptar el regalo si el proveedor insiste, para no ofenderlo",
      "Declinar o, si no es posible rechazarlo en el momento, registrarlo y declararlo según el procedimiento de PEM, permitiendo que se evalúe si compromete la decisión de compra",
      "Aceptarlo en privado, sin informar a nadie, mientras no afecte la decisión final",
      "Aceptarlo solo si el valor es menor a mil pesos, sin necesidad de registrarlo"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.5, la política de PEM sobre regalos y hospitalidad debe:",
    options: [
      "Prohibir absolutamente cualquier regalo o cortesía de negocios, sin excepción",
      "Establecer criterios claros —montos, tipo de valor, frecuencia, y proceso de registro y aprobación— para distinguir una cortesía razonable de un intento de influir indebidamente en una decisión",
      "Dejar la decisión completamente al criterio personal de cada colaborador",
      "Aplicarse únicamente a regalos que superen un millón de pesos"
    ],
    correct: 1
  },
  {
    q: "Un regalo en efectivo (o su equivalente, como una tarjeta de regalo de alto valor) ofrecido a un colaborador de PEM debe tratarse, según el criterio general de la Cl. 8.5, como:",
    options: [
      "Un tipo de regalo aceptable como cualquier otro, mientras se registre",
      "Una señal de alto riesgo: el efectivo o su equivalente rara vez tiene una justificación de cortesía comercial legítima y normalmente se rechaza sin excepción",
      "Algo aceptable si proviene de un proveedor de bajo riesgo",
      "Un tema que no requiere ningún registro"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.6, un donativo de PEM a una organización benéfica vinculada a un funcionario que tiene poder de decisión sobre un permiso pendiente de la empresa debería:",
    options: [
      "Aprobarse sin más análisis, ya que es una donación caritativa",
      "Evaluarse con especial cuidado, porque un donativo dirigido puede ser una forma indirecta de soborno, incluso sin que exista un pago directo al funcionario",
      "Rechazarse automáticamente cualquier donativo, sin excepción, para cualquier causa",
      "Aprobarse solo si el monto es menor al presupuesto anual de donativos"
    ],
    correct: 1
  },
  {
    q: "Un 'pago de facilitación' —una cantidad pequeña entregada informalmente para acelerar un trámite rutinario ante una autoridad— se considera, según el espíritu de ISO 37001:",
    options: [
      "Una práctica aceptable si el monto es simbólico",
      "Una forma de soborno que la política de PEM debe abordar explícitamente, incluso cuando culturalmente se perciba como una práctica común o menor",
      "Algo permitido si el trámite realmente se está retrasando de forma injusta",
      "Un tema sin relación con el sistema antisoborno"
    ],
    correct: 1
  },
  {
    q: "¿Por qué PEM debe mantener un registro de regalos y hospitalidad recibidos u ofrecidos, en vez de confiar solo en la memoria de cada colaborador?",
    options: [
      "No es necesario, un registro formal es excesivo para este tipo de cortesías",
      "Porque el registro permite detectar patrones —como regalos repetidos de un mismo proveedor cerca de decisiones importantes— que serían invisibles sin un mecanismo centralizado",
      "Porque la ley exige registrar únicamente regalos superiores a un millón de pesos",
      "Porque el registro reemplaza la necesidad de cualquier otro control"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta este módulo con la evaluación de riesgo del Módulo 4 y los controles financieros del Módulo 6?",
    options: [
      "No tiene relación, son procesos completamente independientes",
      "Las áreas de mayor riesgo (Compras, trámites regulatorios) son precisamente donde los regalos y la hospitalidad requieren mayor escrutinio, y el registro de regalos funciona con la misma lógica de trazabilidad que un control financiero",
      "Los regalos y la hospitalidad no tienen relación con el riesgo evaluado en otros módulos",
      "Solo se relacionan si el regalo involucra dinero en efectivo"
    ],
    correct: 1
  },
  {
    q: "Un colaborador de PEM recibe una invitación a un evento deportivo de alto valor de un proveedor activo, sin ninguna relación con una decisión de negocio inminente. Según el criterio de proporcionalidad de Cl. 8.5, esto debería:",
    options: [
      "Aceptarse automáticamente sin ningún registro, porque no hay una decisión pendiente",
      "Evaluarse igualmente contra los criterios de la política —valor, frecuencia, contexto— y registrarse según corresponda, porque la frecuencia y el valor acumulado también generan riesgo con el tiempo",
      "Rechazarse siempre, sin excepción, sea cual sea el contexto",
      "Ser una decisión que no requiere ningún criterio objetivo"
    ],
    correct: 1
  },
  {
    q: "¿Por qué la política de regalos y hospitalidad de PEM debe aplicarse tanto a lo que los colaboradores RECIBEN como a lo que PEM OFRECE a terceros?",
    options: [
      "No es necesario, solo lo que se recibe representa un riesgo real",
      "Porque PEM ofreciendo regalos o cortesías excesivas a un cliente o autoridad puede representar el mismo riesgo de influir indebidamente en una decisión, en la dirección opuesta",
      "Porque la norma solo regula lo que los colaboradores reciben de terceros",
      "Porque lo que PEM ofrece nunca representa un riesgo real de soborno"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 7 es que cada colaborador de PEM entienda que la gestión de regalos, hospitalidad, donativos y beneficios:",
    options: [
      "Se resume en 'usa el sentido común', sin necesidad de criterios objetivos",
      "Requiere criterios claros, un mecanismo de registro y aprobación, y atención especial a formas indirectas de soborno como donativos dirigidos o pagos de facilitación",
      "Solo aplica a regalos que superan un monto muy alto",
      "Es responsabilidad exclusiva de quien recibe el regalo, sin necesidad de reportarlo"
    ],
    correct: 1
  }
];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    if(ok) correct++;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok?`<div style="margin-top:8px;color:#E8603D;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
    </div>`;
  }).join('');
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 7. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
</body>
</html>
