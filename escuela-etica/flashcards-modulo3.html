<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Módulo 3 · ISO 37001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0E0C;--surface:#141815;--line:#26302A;--red:#E8603D;--amber:#E8A33D;--text:#F1F3F0;--muted:#8A968E;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:24px;}
  .stage{width:100%;max-width:460px;perspective:1400px;}
  .card{position:relative;width:100%;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;border:1px solid var(--line);}
  .front{background:var(--surface);}
  .back{background:linear-gradient(160deg,#241209,#141815);transform:rotateY(180deg);border-color:var(--red);}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:14px;}
  .term{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1.25;}
  .def{font-size:14px;line-height:1.55;color:var(--text);}
  .flip-hint{position:absolute;bottom:14px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .controls{display:flex;gap:12px;margin-top:26px;width:100%;max-width:460px;}
  button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{border-color:var(--red);}
  button.primary{background:var(--red);color:#1A0A05;border:none;}
  .dots{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;justify-content:center;max-width:460px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--red);}
</style>
</head>
<body>
<a href="../index.html" class="pem-home-btn" aria-label="Volver al inicio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Inicio</a>
<style>
.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#141815;border:1px solid #26302A;color:#F1F3F0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:.15s;}
.pem-home-btn:hover{border-color:#3a463d;background:#1B211D;}
.pem-home-btn svg{flex-shrink:0;}
@media print{.pem-home-btn{display:none !important;}}
@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

  <div class="eyebrow">PEM Excellence Academy</div>
  <h1>Flashcards — Módulo 3</h1>
  <div class="sub">Política antisoborno y gobierno · ISO 37001 Cl. 5.2–5.3</div>
  <div class="counter" id="counter">1 / 10</div>
  <div class="stage">
    <div class="card" id="card" onclick="flip()">
      <div class="face front">
        <div class="tag">Término</div>
        <div class="term" id="termText"></div>
        <div class="flip-hint">Toca para ver la definición</div>
      </div>
      <div class="face back">
        <div class="tag">En PEM significa</div>
        <div class="def" id="defText"></div>
        <div class="flip-hint">Toca para volver</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button onclick="prev()">Anterior</button>
    <button class="primary" onclick="next()">Siguiente</button>
  </div>
  <div class="dots" id="dots"></div>
<script>
const CARDS = [
  {term:"Política antisoborno (Cl. 5.2)", def:"Prohibición explícita del soborno, compromiso legal, y protección a quien reporta de buena fe."},
  {term:"Declaración de Compromiso", def:"Firma de Dirección General — debe reflejarse en acciones y recursos reales, no solo en el papel."},
  {term:"Roles y autoridades (Cl. 5.3)", def:"Asignados y comunicados claramente, para que cada persona sepa qué le corresponde frente al riesgo."},
  {term:"Estructura de roles en PEM", def:"Dirección asegura recursos; Comité gobierna; Función Antisoborno opera independiente; cada colaborador reporta."},
  {term:"Política hacia terceros", def:"Proveedores también deben conocer el estándar de integridad que PEM exige en la relación comercial."},
  {term:"Conexión con el Módulo 2", def:"El liderazgo se traduce en documento formal (política) y roles asignados con estructura concreta."},
  {term:"Omisión de protección al reportante", def:"Sin esa protección explícita, el temor a represalias reduce los reportes reales de riesgo."},
  {term:"Roles documentados vs. informales", def:"La documentación asegura consistencia entre las 5 bases y permite verificarse en auditoría."},
  {term:"Política sin difusión real", def:"Un nuevo colaborador que nunca la leyó representa una falla de comunicación, no de contenido."},
  {term:"Propósito de este módulo", def:"Convertir el compromiso de liderazgo en reglas claras y roles conocidos por todos, incluidos terceros."}
];
let idx = 0; let flipped = false;
function render(){
  document.getElementById('termText').textContent = CARDS[idx].term;
  document.getElementById('defText').textContent = CARDS[idx].def;
  document.getElementById('counter').textContent = (idx+1)+' / '+CARDS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  document.getElementById('dots').innerHTML = CARDS.map((_,i)=>`<div class="dot ${i===idx?'active':''}"></div>`).join('');
}
function flip(){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function next(){ idx=(idx+1)%CARDS.length; render(); }
function prev(){ idx=(idx-1+CARDS.length)%CARDS.length; render(); }
render();
</script>
</body>
</html>
