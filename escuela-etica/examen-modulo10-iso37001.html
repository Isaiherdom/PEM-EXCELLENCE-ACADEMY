<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 10 · ISO 37001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E0C; --surface:#141815; --surface-2:#1B211D; --line:#26302A;
    --red:#E8603D; --amber:#E8A33D; --text:#F1F3F0; --muted:#8A968E; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(232,96,61,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--red);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--red);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--red);background:rgba(232,96,61,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--red);color:#1A0A05;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--red);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--red);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela de Ética y Cumplimiento</div>
  <h1>Módulo 10 — Investigaciones y Conflictos de Interés</h1>
  <div class="sub">ISO 37001 Cl. 8.10, 8.13 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#E8603D" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <button class="btn-primary" onclick="location.reload()">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-37001-M10 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Un reporte llega al canal de denuncias señalando a un colaborador de Compras. La investigación la realiza su propio jefe directo, quien además es amigo cercano del proveedor mencionado. Según Cl. 8.10, esto representa:",
    options: [
      "Una práctica aceptable, ya que el jefe conoce mejor el contexto de su equipo",
      "Un problema grave de objetividad: quien investiga debe ser independiente de las personas y relaciones involucradas en el caso, para que la investigación sea creíble y justa",
      "Un tema sin relación con la investigación en sí",
      "Algo que solo importa si el reporte resulta confirmado"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.10, una investigación de un reporte de soborno en PEM debe caracterizarse por ser:",
    options: [
      "Rápida por encima de todo, sin importar la calidad del proceso",
      "Objetiva, oportuna, y realizada manteniendo la confidencialidad apropiada tanto para el reportante como para la persona investigada",
      "Pública desde el inicio, para demostrar transparencia ante todo el personal",
      "Responsabilidad exclusiva de la persona señalada en el reporte"
    ],
    correct: 1
  },
  {
    q: "Un 'conflicto de interés' relevante para el SGAS de PEM, según Cl. 8.13, ocurre cuando:",
    options: [
      "Un colaborador simplemente conoce a un proveedor de PEM",
      "Un colaborador tiene un interés personal, financiero o de relación que podría influir —o parecer influir— en su capacidad de tomar una decisión objetiva de negocio",
      "Un colaborador tiene una opinión personal sobre un proyecto de la empresa",
      "Un colaborador ha trabajado antes para un competidor de PEM"
    ],
    correct: 1
  },
  {
    q: "Un colaborador de Compras cuyo familiar directo es dueño de una empresa proveedora activa de PEM declara esa relación formalmente antes de participar en la selección de proveedores. Esto es un ejemplo de:",
    options: [
      "Una acción innecesaria, ya que declarar la relación no cambia nada en la práctica",
      "Gestión correcta de conflicto de interés (Cl. 8.13): la declaración permite a PEM decidir si ese colaborador debe abstenerse de participar en la decisión, en vez de ocultar la relación",
      "Un tema exclusivo de Recursos Humanos, sin relación con el SGAS",
      "Algo que solo se declara si la relación involucra dinero directo"
    ],
    correct: 1
  },
  {
    q: "¿Por qué PEM debe mantener un registro de declaraciones de conflicto de interés, en vez de confiar solo en que cada colaborador 'sepa hacer lo correcto'?",
    options: [
      "No es necesario, la confianza informal es suficiente",
      "Porque un registro formal permite verificar consistencia, identificar patrones, y tomar decisiones informadas sobre quién debe participar o abstenerse en una decisión específica",
      "Porque la ley exige registrar únicamente conflictos de interés de montos muy altos",
      "Porque el registro reemplaza la necesidad de cualquier otro control"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta la gestión de conflictos de interés (Cl. 8.13) con los controles financieros del Módulo 6 (segregación de funciones)?",
    options: [
      "No tiene relación, son requisitos completamente independientes",
      "Un conflicto de interés no declarado puede anular el propósito de la segregación de funciones: si la persona que aprueba tiene una relación oculta con el proveedor, la separación de roles ya no protege nada",
      "Los conflictos de interés reemplazan la necesidad de segregación de funciones",
      "Solo se relacionan si el conflicto involucra un monto superior al presupuesto anual"
    ],
    correct: 1
  },
  {
    q: "Si una investigación de un reporte de soborno concluye sin encontrar evidencia suficiente, ¿qué debe pasar con el caso, según el espíritu de Cl. 8.10?",
    options: [
      "Debe eliminarse todo registro del proceso, como si nunca hubiera ocurrido",
      "Debe documentarse el proceso seguido y la conclusión alcanzada, manteniendo la protección del reportante de buena fe vista en el Módulo 9",
      "El reportante debe ser sancionado por el reporte no confirmado",
      "Debe reabrirse automáticamente cada seis meses sin ninguna razón nueva"
    ],
    correct: 1
  },
  {
    q: "¿Por qué la confidencialidad durante una investigación protege tanto al reportante como a la persona investigada?",
    options: [
      "No protege a la persona investigada, solo al reportante",
      "Porque difundir acusaciones no confirmadas puede dañar injustamente la reputación de alguien, mientras que la confidencialidad permite que el proceso siga su curso de forma justa para ambas partes",
      "Porque la confidencialidad es solo un formalismo sin efecto real",
      "Porque solo aplica si la persona investigada tiene un puesto directivo"
    ],
    correct: 1
  },
  {
    q: "¿Qué debería hacer un colaborador de PEM que se da cuenta de que tiene un posible conflicto de interés en una decisión próxima, antes de que alguien más lo detecte?",
    options: [
      "Nada, mientras esté seguro de que puede ser objetivo de todas formas",
      "Declararlo proactivamente a través del mecanismo correspondiente, permitiendo que PEM decida cómo gestionar la situación antes de que la decisión se tome",
      "Esperar a ver si alguien más lo señala primero",
      "Resolverlo en privado sin informar a nadie, si considera que no es grave"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 10 es que cada colaborador de PEM entienda que las investigaciones y los conflictos de interés:",
    options: [
      "Son procesos que solo le corresponden al Comité de Integridad, sin relación con el resto del personal",
      "Requieren objetividad real —incluyendo quién investiga y quién declara— para que el sistema antisoborno funcione con credibilidad, tanto al revisar reportes como al prevenir decisiones comprometidas antes de que ocurran",
      "Solo se activan si ya existe una sanción confirmada",
      "Se resuelven automáticamente si existe un canal de denuncias"
    ],
    correct: 1
  }
];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    if(ok) correct++;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok?`<div style="margin-top:8px;color:#E8603D;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
    </div>`;
  }).join('');
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    verdictSub.textContent = 'Cumples el estándar del Módulo 10. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
</body>
</html>
