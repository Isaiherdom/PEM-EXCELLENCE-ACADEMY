<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos · PEM Excellence Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/recursos.js"></script>
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#E4DFD4;
    --green:#0B7A4B; --amber:#A9720F; --blue:#1B5FA8; --red:#932A2A;
    --text:#1C1A16; --muted:#6B655A;
  }
  html[data-theme="dark"]{
    --bg:#070B0A; --surface:#0D1311; --surface-2:#141B18; --line:#24302B;
    --green:#22E88A; --amber:#FF7A1A; --blue:#4C9AFF; --red:#E8603D;
    --text:#FFFFFF; --muted:#AAB5AF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:32px 16px 70px;}
  .wrap{max-width:900px;margin:0 auto;}
  .head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,32px);margin:0 0 8px;}
  .sub{color:var(--muted);font-size:14px;max-width:760px;line-height:1.6;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(28,26,22,.04),0 3px 12px rgba(28,26,22,.05);}

  .category{margin-bottom:30px;}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .cat-head .ic{width:34px;height:34px;border-radius:9px;background:var(--cc-bg,var(--surface-2));color:var(--cc,var(--green));display:flex;align-items:center;justify-content:center;font-size:16px;}
  .cat-head h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;}

  .doc-row{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:var(--text);}
  .doc-row .ic{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .doc-body{flex:1;min-width:0;}
  .doc-title{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .doc-desc{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:5px;}
  .doc-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
  .doc-action{font-size:12px;font-weight:700;color:var(--cc,var(--green));border:1px solid var(--cc,var(--green));border-radius:20px;padding:8px 16px;white-space:nowrap;flex-shrink:0;}
  .doc-row:hover .doc-action{background:var(--cc,var(--green));color:#06140D;}

  .contact-card{padding:22px;margin-top:20px;}
  .contact-card h2{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 12px;}
  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .contact-item{font-size:13px;}
  .contact-item .l{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
  .contact-item .v{font-weight:700;}

  @media(max-width:700px){
    .doc-row{flex-wrap:wrap;}
    .doc-action{margin-left:52px;}
    .contact-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<script src="assets/auth-config.js"></script>
<div id="pemGateOverlay" style="position:fixed;inset:0;z-index:2147483647;background:#0B0E0C;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:340px;width:100%;background:#141815;border:1px solid #26302A;border-radius:14px;padding:28px 24px;text-align:center;font-family:'Inter',sans-serif;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#16C270;text-transform:uppercase;margin-bottom:10px;">PEM Excellence Academy</div>
    <div style="color:#F1F3F0;font-size:14px;margin-bottom:16px;">Acceso restringido — ingresa la contraseña</div>
    <input type="password" id="pemGatePw" style="width:100%;box-sizing:border-box;padding:11px;font-size:15px;background:#0B0E0C;border:1px solid #26302A;color:#F1F3F0;border-radius:8px;margin-bottom:10px;" placeholder="Contraseña">
    <button onclick="pemGateSubmit()" style="width:100%;background:#16C270;color:#06140D;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">Entrar</button>
    <div id="pemGateError" style="color:#E8603D;font-size:12px;margin-top:10px;display:none;">Contraseña incorrecta</div>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem('pemAuthOK') === '1'){
    document.getElementById('pemGateOverlay').style.display = 'none';
  }
})();
async function pemGateSubmit(){
  const pw = document.getElementById('pemGatePw').value;
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if(hash === PEM_AUTH_HASH){
    sessionStorage.setItem('pemAuthOK','1');
    document.getElementById('pemGateOverlay').style.display = 'none';
  } else {
    document.getElementById('pemGateError').style.display = 'block';
  }
}
document.addEventListener('DOMContentLoaded', function(){
  var el = document.getElementById('pemGatePw');
  if(el) el.addEventListener('keydown', function(e){ if(e.key==='Enter') pemGateSubmit(); });
});
</script>

  <div class="wrap">
    <div class="head">
      <div class="eyebrow">PEM Excellence Academy</div>
      <h1>Recursos</h1>
      <div class="sub">Documentos oficiales de apoyo — políticas, pósters y material de referencia de PEM.</div>
    </div>

    <div id="categories"></div>

    <div class="card contact-card">
      <h2>Canal de Denuncias</h2>
      <div class="contact-grid" id="contactGrid"></div>
    </div>
  </div>

<script>
function render(){
  const el = document.getElementById('categories');
  el.innerHTML = PEM_RECURSOS.map(cat => `
    <div class="category">
      <div class="cat-head">
        <div class="ic" style="--cc:${cat.color};--cc-bg:color-mix(in srgb, ${cat.color} 14%, var(--surface))">${cat.icon}</div>
        <h2>${cat.category}</h2>
      </div>
      ${cat.docs.map(d => `
        <a class="card doc-row" style="--cc:${cat.color}" href="${d.file}" target="_blank" rel="noopener">
          <div class="ic">📄</div>
          <div class="doc-body">
            <div class="doc-title">${d.title}</div>
            <div class="doc-desc">${d.desc}</div>
            <div class="doc-meta">${d.meta}</div>
          </div>
          <span class="doc-action">Ver / Descargar</span>
        </a>
      `).join('')}
    </div>
  `).join('');

  const c = PEM_RECURSOS_CONTACTO;
  document.getElementById('contactGrid').innerHTML = `
    <div class="contact-item"><div class="l">Correo</div><div class="v">${c.correo}</div></div>
    <div class="contact-item"><div class="l">Teléfono</div><div class="v">${c.telefono}</div></div>
    <div class="contact-item"><div class="l">Web</div><div class="v">${c.web}</div></div>
  `;
}
render();
</script>

<script src="assets/shell.js" defer></script>
</body>
</html>
