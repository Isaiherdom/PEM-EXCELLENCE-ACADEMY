<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos · PEM Excellence Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/recursos.js"></script>
<style>
  :root{
    --bg:#F5F6F3; --panel:#FFFFFF; --ink:#15201D; --muted:#68736F; --line:#E3E7E3;
    --green:#087F5B; --green2:#19A974; --mint:#DFF3EA;
    --blue:#4D78B8; --blueSoft:#E6EEF9;
    --gold:#C7923E; --goldSoft:#F8EDD9;
    --red:#C76A58; --redSoft:#F7E5E0;
    --shadow:0 8px 24px rgba(24,39,33,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}

  body[data-pem-no-shell-header]{padding-top:var(--home-nav-h,64px) !important;}
  body[data-pem-no-shell-header] .pem-sidebar{top:var(--home-nav-h,64px) !important;height:calc(100vh - var(--home-nav-h,64px)) !important;}
  body[data-pem-no-shell-header] .pem-sidebar-brand{display:none;}
  .exec-nav{position:fixed;top:0;left:0;right:0;z-index:9500;display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);margin-left:calc(-1 * var(--pem-sb-w,0px));width:calc(100% + var(--pem-sb-w,0px));}
  .exec-nav .burger{display:none;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;color:var(--ink);cursor:pointer;}
  .exec-nav .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
  .exec-nav .wordmark span{color:var(--green);}
  @media(max-width:900px){
    .exec-nav{margin-left:0;width:100%;}
    .exec-nav .burger{display:inline-flex;}
  }

  .wrap{max-width:920px;margin:0 auto;padding:26px 28px 60px;}
  .header{margin-bottom:20px;}
  .kicker{font-size:10.5px;letter-spacing:2px;color:var(--green);font-weight:800;text-transform:uppercase;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,3.4vw,34px);margin:6px 0 5px;letter-spacing:-.5px;}
  .subtitle{font-size:13.5px;color:var(--muted);max-width:700px;line-height:1.6;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .kpi{padding:17px 18px;}
  .kpi .label{font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:800;text-transform:uppercase;}
  .kpi .value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px;}
  .kpi .foot{font-size:11px;color:var(--muted);}

  .category{margin-bottom:26px;}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .cat-head .ic{width:32px;height:32px;border-radius:9px;background:var(--cc-bg,var(--mint));color:var(--cc,var(--green));display:flex;align-items:center;justify-content:center;font-size:15px;}
  .cat-head h2{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0;}

  .doc-row{display:flex;align-items:center;gap:14px;padding:15px 18px;margin-bottom:10px;text-decoration:none;color:var(--ink);}
  .doc-row .ic{width:36px;height:36px;border-radius:9px;background:var(--goldSoft);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .doc-body{flex:1;min-width:0;}
  .doc-title{font-weight:700;font-size:14px;margin-bottom:3px;}
  .doc-desc{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:5px;}
  .doc-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
  .doc-action{font-size:11.5px;font-weight:700;color:var(--cc,var(--green));border:1px solid var(--cc,var(--green));border-radius:20px;padding:7px 14px;white-space:nowrap;flex-shrink:0;}
  .doc-row:hover .doc-action{background:var(--cc,var(--green));color:#fff;}

  .contact-card{padding:20px 22px;margin-top:6px;}
  .contact-card h2{font-family:'Space Grotesk',sans-serif;font-size:14.5px;margin:0 0 12px;}
  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .contact-item{font-size:12.5px;}
  .contact-item .l{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
  .contact-item .v{font-weight:700;}

  @media(max-width:900px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  @media(max-width:700px){
    .wrap{padding:18px 14px 50px;}
    .grid3{grid-template-columns:1fr;}
    .doc-row{flex-wrap:wrap;}
    .doc-action{margin-left:50px;}
    .contact-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body data-pem-no-shell-header>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/pem-gate.js"></script>


<div class="exec-nav">
  <button class="burger" id="pemBurger" aria-label="Abrir menú">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
  </button>
  <div class="wordmark">PEM <span>Excellence Academy</span></div>
</div>

  <div class="wrap">
    <div class="header">
      <div class="kicker">Documentación oficial</div>
      <h1>Recursos</h1>
      <div class="subtitle">Documentos oficiales de apoyo — políticas, pósters y material de referencia de PEM.</div>
    </div>

    <section class="grid3" id="kpiGrid"></section>

    <div id="categories"></div>

    <div class="card contact-card">
      <h2>Canal de Denuncias</h2>
      <div class="contact-grid" id="contactGrid"></div>
    </div>
  </div>

<script>
function render(){
  const totalDocs = PEM_RECURSOS.reduce((a,cat)=>a+cat.docs.length, 0);
  const totalCats = PEM_RECURSOS.length;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="card kpi"><div class="label">Documentos disponibles</div><div class="value">${totalDocs}</div><div class="foot">Listos para ver o descargar</div></div>
    <div class="card kpi"><div class="label">Categorías</div><div class="value">${totalCats}</div><div class="foot">Ética, integridad y más</div></div>
    <div class="card kpi"><div class="label">Acceso</div><div class="value" style="font-size:18px;">Toda la Academia</div><div class="foot">Mismo acceso que la plataforma</div></div>
  `;

  const el = document.getElementById('categories');
  el.innerHTML = PEM_RECURSOS.map(cat => `
    <div class="category">
      <div class="cat-head">
        <div class="ic" style="--cc:${cat.color};--cc-bg:color-mix(in srgb, ${cat.color} 16%, var(--panel))">${cat.icon}</div>
        <h2>${cat.category}</h2>
      </div>
      ${cat.docs.map(d => `
        <a class="card doc-row" style="--cc:${cat.color}" href="${d.file}" target="_blank" rel="noopener">
          <div class="ic">📄</div>
          <div class="doc-body">
            <div class="doc-title">${d.title}</div>
            <div class="doc-desc">${d.desc}</div>
            <div class="doc-meta">${d.meta}</div>
          </div>
          <span class="doc-action">Ver / Descargar</span>
        </a>
      `).join('')}
    </div>
  `).join('');

  const c = PEM_RECURSOS_CONTACTO;
  document.getElementById('contactGrid').innerHTML = `
    <div class="contact-item"><div class="l">Correo</div><div class="v">${c.correo}</div></div>
    <div class="contact-item"><div class="l">Teléfono</div><div class="v">${c.telefono}</div></div>
    <div class="contact-item"><div class="l">Web</div><div class="v">${c.web}</div></div>
  `;
}
render();

(function(){
  function syncNavHeight(){
    var nav = document.querySelector('.exec-nav');
    if(nav) document.documentElement.style.setProperty('--home-nav-h', nav.offsetHeight + 'px');
  }
  syncNavHeight();
  window.addEventListener('resize', syncNavHeight);
  window.addEventListener('DOMContentLoaded', syncNavHeight);
})();
</script>

<script src="assets/shell.js" defer></script>
</body>
</html>
