<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Módulo 8 · ISO 14001</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/shell.css">
<style>
  :root{--bg:#F3F1EC;--surface:#FFFFFF;--line:#E4DFD4;--blue:#1B5FA8;--amber:#A9720F;--text:#1C1A16;--muted:#6B655A;}
  html[data-theme="dark"]{--bg:#070B0A;--surface:#0D1311;--line:#24302B;--blue:#4C9AFF;--amber:#FF7A1A;--text:#FFFFFF;--muted:#AAB5AF;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:24px;}
  .stage{width:100%;max-width:460px;perspective:1400px;}
  .card{position:relative;width:100%;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;border:1px solid var(--line);}
  .front{background:var(--surface);}
  .back{background:linear-gradient(160deg,#0E1B24,#141815);transform:rotateY(180deg);border-color:var(--blue);}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:14px;}
  .term{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1.25;}
  .def{font-size:14px;line-height:1.55;color:#EDEFEC;}
  .flip-hint{position:absolute;bottom:14px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .controls{display:flex;gap:12px;margin-top:26px;width:100%;max-width:460px;}
  button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{border-color:var(--blue);}
  button.primary{background:var(--blue);color:#06140D;border:none;}
  .dots{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;justify-content:center;max-width:460px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--blue);}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/pem-gate.js"></script>




  <div class="eyebrow">PEM Excellence Academy</div>
  <h1>Flashcards — Módulo 8</h1>
  <div class="sub">Control operacional ambiental · ISO 14001 Cl. 8.1</div>
  <div class="counter" id="counter">1 / 10</div>
  <div class="stage">
    <div class="card" id="card" onclick="flip()">
      <div class="face front">
        <div class="tag">Término</div>
        <div class="term" id="termText"></div>
        <div class="flip-hint">Toca para ver la definición</div>
      </div>
      <div class="face back">
        <div class="tag">En PEM significa</div>
        <div class="def" id="defText"></div>
        <div class="flip-hint">Toca para volver</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button onclick="prev()">Anterior</button>
    <button class="primary" id="btnNext" onclick="next()">Siguiente</button>
  </div>
  <div class="dots" id="dots"></div>
<script>
const CARDS = [
  {term:"Control operacional ambiental (Cl. 8.1)", def:"Procedimientos concretos para los procesos con aspectos ambientales significativos — como manejo de residuos."},
  {term:"Segregación de residuos", def:"Un procedimiento claro evita mezclar residuos peligrosos y no peligrosos en el mismo contenedor."},
  {term:"Kit de contención listo", def:"Disponible antes del incidente, con checklist de verificación periódica — no comprado y olvidado."},
  {term:"Cambio no planificado (residuos)", def:"Sustituir al proveedor de recolección sin evaluar su capacidad puede generar manejo inadecuado."},
  {term:"Almacenamiento de sustancias", def:"Condiciones adecuadas, señalización y procedimientos que previenen derrames antes de que ocurran."},
  {term:"Control de procesos externos", def:"La disposición final de residuos por un proveedor también se controla — su falla puede alcanzar a PEM."},
  {term:"Actuar dentro del procedimiento", def:"Un supervisor que contiene una fuga siguiendo el protocolo ya definido, sin esperar autorización adicional."},
  {term:"Conexión con aspectos significativos", def:"Los controles operacionales se concentran en lo identificado como significativo en el Módulo 4."},
  {term:"Ausencia de control operacional", def:"Genera decisiones inconsistentes entre bases ante el mismo tipo de situación ambiental."},
  {term:"Propósito de este módulo", def:"Convertir los aspectos significativos en procedimientos verificables y consistentes en los sitios de trabajo."}
];
let idx = 0; let flipped = false;
function render(){
  document.getElementById('termText').textContent = CARDS[idx].term;
  document.getElementById('defText').textContent = CARDS[idx].def;
  document.getElementById('counter').textContent = (idx+1)+' / '+CARDS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  document.getElementById('dots').innerHTML = CARDS.map((_,i)=>`<div class="dot ${i===idx?'active':''}"></div>`).join('');
  document.getElementById('btnNext').textContent = (idx === CARDS.length - 1) ? 'Terminar ✓' : 'Siguiente';
}
function flip(){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function next(){
  if(idx === CARDS.length - 1){
    window.location.href = '../index.html';
    return;
  }
  idx=(idx+1)%CARDS.length; render();
}
function prev(){ idx=(idx-1+CARDS.length)%CARDS.length; render(); }
render();
</script>
<script src="../assets/shell.js" defer></script>
</body>
</html>
