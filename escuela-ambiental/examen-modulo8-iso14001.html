<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 8 · ISO 14001</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/shell.css?v=3">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#E4DFD4;
    --blue:#1B5FA8; --amber:#A9720F; --text:#1C1A16; --muted:#6B655A; --bad:#932A2A;
  }
  html[data-theme="dark"]{
    --bg:#070B0A; --surface:#0D1311; --surface-2:#141B18; --line:#24302B;
    --blue:#4C9AFF; --amber:#FF7A1A; --text:#FFFFFF; --muted:#AAB5AF; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(76,154,255,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--blue);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--blue);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--blue);background:rgba(76,154,255,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--blue);color:#06140D;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--blue);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--blue);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/pem-gate.js"></script>




<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela Ambiental</div>
  <h1>Módulo 8 — Control Operacional Ambiental</h1>
  <div class="sub">ISO 14001 Cl. 8.1 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#4C9AFF" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-14001-M8 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "En una base de PEM, los residuos peligrosos y no peligrosos se mezclan en el mismo contenedor porque no hay un procedimiento claro de segregación. Según Cl. 8.1, esto refleja principalmente:",
    options: [
      "Una decisión que resulta aceptable siempre y cuando el volumen mezclado sea reducido en cantidad",
      "Ausencia de control operacional: la norma exige establecer criterios para procesos con aspectos significativos",
      "Un tema que corresponde de forma exclusiva al proveedor encargado de recolectar los residuos",
      "Algo que, en realidad, no guarda relación directa con el aspecto identificado en el Módulo 4"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 8.1, PEM debe establecer, implementar y controlar los procesos necesarios para cumplir los requisitos del SGA, considerando una perspectiva de:",
    options: [
      "Únicamente el costo económico total asociado a cada uno de los procesos que se llegan a evaluar en la operación",
      "Ciclo de vida: desde la adquisición hasta el tratamiento al final de la vida útil, dentro del alcance definido",
      "Solamente la opinión que tenga el cliente sobre cómo debe ejecutarse cada proceso en cuestión",
      "Solo lo que llega a ocurrir dentro de las oficinas administrativas de la empresa PEM"
    ],
    correct: 1
  },
  {
    q: "El kit de contención de derrames debe estar disponible y listo antes de que ocurra un incidente, con un checklist de verificación periódica. Esto es un ejemplo directo de:",
    options: [
      "Un gasto de tipo preventivo, sin relación directa alguna con lo que exige realmente la norma aplicable",
      "Control operacional: un criterio verificable que asegura la respuesta ante un derrame bajo condiciones controladas",
      "Un requisito que corresponde de forma exclusiva al área de Seguridad, sin relación con el SGA",
      "Una decisión que depende únicamente del criterio personal que tenga cada supervisor de base"
    ],
    correct: 1
  },
  {
    q: "PEM cambia el proveedor que recolecta sus residuos peligrosos a mitad de un contrato, sin evaluar antes su capacidad de manejo adecuado. Según Cl. 8.1, ¿qué riesgo se genera?",
    options: [
      "Ningún riesgo real, siempre que el nuevo proveedor resulte ser más económico que el anterior contratado previamente",
      "Un cambio no planificado que puede afectar la conformidad ambiental, aunque ocurra fuera de sus instalaciones",
      "Un tema que corresponde resolver de forma exclusiva al proveedor involucrado en la recolección",
      "Algo que solamente se llega a evaluar en el caso de que se presente una sanción posterior"
    ],
    correct: 1
  },
  {
    q: "El almacenamiento de sustancias químicas o combustibles en una base de PEM debe controlarse considerando:",
    options: [
      "Solamente la cantidad total disponible dentro del inventario registrado de esa base en particular",
      "Condiciones adecuadas de almacenamiento, señalización, y procedimientos que prevengan derrames o fugas",
      "Únicamente el costo asociado a las sustancias que se encuentran almacenadas en ese momento",
      "Algo que solamente se controla en el caso de que la autoridad lo solicite durante una inspección"
    ],
    correct: 1
  },
  {
    q: "¿Por qué PEM debe controlar también los procesos ambientales contratados externamente, como la disposición final de residuos peligrosos?",
    options: [
      "No resulta necesario, ya que la responsabilidad recae de forma exclusiva en el proveedor una vez que este lo recoge",
      "Porque ese proceso externo puede afectar la conformidad ambiental de PEM, incluso fuera de sus instalaciones",
      "Porque la norma exige, sin ninguna excepción, contratar únicamente proveedores certificados en ISO 14001",
      "Es un tema puramente comercial, sin ninguna relación real con el sistema de gestión ambiental"
    ],
    correct: 1
  },
  {
    q: "Un supervisor detecta una fuga menor de combustible y actúa de inmediato siguiendo el procedimiento de contención, en vez de esperar a que alguien más lo autorice. Esto es un ejemplo de:",
    options: [
      "Una extralimitación de funciones que en realidad no le correspondía al supervisor en cuestión",
      "Control operacional bien ejecutado: actuar dentro de un procedimiento definido y con la autoridad correspondiente",
      "Un riesgo adicional que se generó sin ninguna justificación real dentro de la operación diaria",
      "Algo que, en realidad, no guarda relación alguna con lo que exige la norma ISO 14001"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta el control operacional ambiental (Cl. 8.1) con los aspectos significativos identificados en el Módulo 4?",
    options: [
      "No guarda ninguna relación real; se trata de procesos que resultan completamente independientes entre sí",
      "Los controles operacionales se concentran en los aspectos significativos ya identificados, para gestionar el riesgo real",
      "El control operacional, en la práctica, reemplaza por completo la necesidad de identificar aspectos ambientales",
      "Solamente llegan a relacionarse entre sí cuando efectivamente ocurre un incidente ambiental real"
    ],
    correct: 1
  },
  {
    q: "Si una base de PEM no tiene procedimientos claros de manejo de residuos, contención de derrames y almacenamiento de sustancias, ¿qué patrón de riesgo se repite, similar a lo visto en la Escuela de Calidad?",
    options: [
      "Ningún patrón real; se trata de sistemas de gestión que resultan completamente distintos entre sí",
      "La ausencia de control operacional definido lleva a decisiones inconsistentes ante el mismo tipo de situación",
      "Es un problema que resulta exclusivo de esa base en particular, sin relación con el sistema completo",
      "Se termina resolviendo de forma automática con más personal, sin necesidad real de procedimientos"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 8 es que cada colaborador de PEM entienda que el control operacional ambiental:",
    options: [
      "Es una responsabilidad exclusiva del área de HSE, sin ninguna relación directa con la operación diaria de campo en las bases",
      "Convierte los aspectos ambientales significativos en procedimientos concretos y verificables en los sitios de trabajo",
      "Solamente resulta aplicable en el caso de que llegue a ocurrir un incidente ambiental de gravedad considerable",
      "Se define de forma exclusiva una sola vez, y en realidad no requiere ningún tipo de revisión posterior"
    ],
    correct: 1
  }
];
(function shuffleOptions(){
  QUESTIONS.forEach(function(q){
    var idx = q.options.map(function(_,i){ return i; });
    for(var i=idx.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=idx[i]; idx[i]=idx[j]; idx[j]=t;
    }
    q.options = idx.map(function(i){ return q.options[i]; });
    q.correct = idx.indexOf(q.correct);
  });
})();

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.correct) correct++; });
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok && pass?`<div style="margin-top:8px;color:#4C9AFF;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
      ${!ok && !pass?`<div style="margin-top:8px;color:var(--muted);font-style:italic;">Revisa el video y las flashcards de este módulo antes de reintentar.</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 8. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
<script src="../assets/shell.js?v=3" defer></script>
</body>
</html>
