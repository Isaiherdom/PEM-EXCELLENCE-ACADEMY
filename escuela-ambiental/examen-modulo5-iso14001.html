<!DOCTYPE html>
<html lang="es">
<head>
<script>try{if(localStorage.getItem('pemTheme')==='pem-green')document.documentElement.setAttribute('data-theme','pem-green');}catch(e){}</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 5 · ISO 14001</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --bg:#0B0E0C; --surface:#141815; --surface-2:#1B211D; --line:#26302A;
    --blue:#4C9AFF; --amber:#E8A33D; --text:#F1F3F0; --muted:#8A968E; --bad:#E8603D;
  }
  html[data-theme="pem-green"]{--bg:#071F14;--surface:#0A2A1C;--surface-2:#0F3D28;--line:#1A3D2C;--muted:#7C9688;--green:#4A8266;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(76,154,255,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--blue);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--blue);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--blue);background:rgba(76,154,255,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--blue);color:#06140D;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--blue);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--blue);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<a href="../index.html" class="pem-home-btn" aria-label="Volver al inicio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Inicio</a>
<style>
.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#0B1712;border:1.5px solid #16C270;color:#2CFF9B;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 0 16px rgba(22,194,112,.45),0 4px 14px rgba(0,0,0,.4);transition:.15s;}
.pem-home-btn:hover{background:#16C270;color:#06140D;box-shadow:0 0 22px rgba(22,194,112,.7),0 4px 14px rgba(0,0,0,.4);}
.pem-home-btn svg{flex-shrink:0;}
@media print{.pem-home-btn{display:none !important;}}
@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela Ambiental</div>
  <h1>Módulo 5 — Objetivos Ambientales y Planificación de Acciones</h1>
  <div class="sub">ISO 14001 Cl. 6.2 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#4C9AFF" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-14001-M5 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "'Reducir el impacto ambiental de PEM' es una frase que suena bien en una junta, pero según Cl. 6.2 NO es todavía un objetivo ambiental válido porque:",
    options: [
      "Es demasiado ambiciosa para una empresa mediana",
      "No es medible, no tiene plazo ni forma de evaluarse — un objetivo ambiental debe ser concreto y verificable, igual que un objetivo de calidad",
      "Los objetivos ambientales no pueden definirse por base",
      "En realidad sí cumple con todo lo que pide la norma"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 6.2, los objetivos ambientales de PEM deben ser coherentes con:",
    options: [
      "Únicamente el presupuesto disponible del área de HSE",
      "La política ambiental, y deben considerar los aspectos ambientales significativos, los requisitos legales aplicables, y los riesgos y oportunidades identificados",
      "Solo la opinión del cliente más grande de PEM",
      "Exclusivamente el historial de sanciones previas"
    ],
    correct: 1
  },
  {
    q: "'Reducir en 20% el volumen de aceite usado no reciclado en la base de Villahermosa en los próximos 12 meses' es un buen objetivo ambiental porque:",
    options: [
      "Suena comprometido con el medio ambiente",
      "Es medible, tiene plazo definido, y responde directamente a un aspecto ambiental significativo identificado en el Módulo 4 (manejo de aceites usados)",
      "No necesita un responsable asignado para ser válido",
      "Aplica automáticamente a las otras 4 bases sin necesidad de adaptarlo"
    ],
    correct: 1
  },
  {
    q: "Al planificar cómo lograr un objetivo ambiental, la Cl. 6.2 exige definir, igual que se vio en la Escuela de Calidad:",
    options: [
      "Solo la fecha límite, sin más detalle",
      "Qué se va a hacer, qué recursos se requerirán, quién será responsable, cuándo se finalizará y cómo se evaluarán los resultados",
      "Únicamente el presupuesto asignado, sin plan de acción",
      "Solo el nombre del objetivo"
    ],
    correct: 1
  },
  {
    q: "¿Por qué un objetivo ambiental de PEM debe estar conectado con un aspecto ambiental significativo (visto en el Módulo 4)?",
    options: [
      "No es necesario, los objetivos pueden ser independientes de los aspectos identificados",
      "Porque de lo contrario se estaría invirtiendo esfuerzo en algo que no representa el riesgo ambiental real de la operación de PEM",
      "Porque la norma exige un objetivo por cada aspecto identificado, sin excepción",
      "Porque los aspectos significativos ya no requieren objetivos, solo controles"
    ],
    correct: 1
  },
  {
    q: "Un objetivo ambiental que nunca se comunica a los colaboradores de la base donde aplica:",
    options: [
      "Sigue siendo válido, la comunicación es opcional en la Cl. 6.2",
      "Incumple el mismo principio visto en la Escuela de Calidad: los objetivos deben comunicarse y monitorearse, no solo documentarse",
      "Solo necesita comunicarse si lo pide la autoridad ambiental",
      "Es responsabilidad exclusiva del área de Recursos Humanos comunicarlo"
    ],
    correct: 1
  },
  {
    q: "Si PEM planea reducir su consumo de combustible por hora de operación, pero nunca define quién es responsable de dar seguimiento al indicador, ¿qué riesgo se genera?",
    options: [
      "Ninguno, el objetivo se cumple solo con estar documentado",
      "El objetivo puede quedar sin monitoreo real, y PEM no sabría si realmente se está logrando o si necesita ajustarse — el mismo riesgo de objetivos 'de papel' visto en Calidad",
      "El indicador se actualiza automáticamente sin necesidad de un responsable",
      "Es un tema que solo le corresponde verificar al cliente"
    ],
    correct: 1
  },
  {
    q: "Los objetivos ambientales de PEM se revisan y actualizan:",
    options: [
      "Nunca, una vez definidos permanecen igual indefinidamente",
      "De forma periódica, considerando si los aspectos, riesgos o requisitos legales han cambiado desde que se definieron",
      "Solo si ocurre una sanción de la autoridad ambiental",
      "Exclusivamente durante la auditoría de certificación"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta este módulo con los objetivos de calidad vistos en la Escuela de Calidad (Módulo 5 de esa escuela)?",
    options: [
      "No hay ninguna relación entre ambos sistemas",
      "Usan exactamente la misma disciplina metodológica —medible, con plan de acción, monitoreado— aplicada ahora al desempeño ambiental en vez de al desempeño de calidad",
      "Los objetivos ambientales reemplazan a los objetivos de calidad",
      "Solo se relacionan si el cliente exige ambos sistemas certificados"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 5 es que cada líder de PEM entienda que los objetivos ambientales:",
    options: [
      "Son declaraciones de buena voluntad sin necesidad de plan ni seguimiento",
      "Deben ser medibles y estar planificados con la misma disciplina que un objetivo de calidad, conectados a los aspectos significativos reales de la operación",
      "Solo importan si el cliente los solicita explícitamente en el contrato",
      "Se definen una sola vez, al certificar el sistema por primera vez"
    ],
    correct: 1
  }
];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    if(ok) correct++;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok?`<div style="margin-top:8px;color:#4C9AFF;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
    </div>`;
  }).join('');
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 5. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
</body>
</html>
