<!DOCTYPE html>
<html lang="es">
<head>

<script>(function(){var t=localStorage.getItem("pemTheme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Excellence Academy · Examen Módulo 7 · ISO 14001</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/shell.css?v=3">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#E4DFD4;
    --blue:#1B5FA8; --amber:#A9720F; --text:#1C1A16; --muted:#6B655A; --bad:#932A2A;
  }
  html[data-theme="dark"]{
    --bg:#070B0A; --surface:#0D1311; --surface-2:#141B18; --line:#24302B;
    --blue:#4C9AFF; --amber:#FF7A1A; --text:#FFFFFF; --muted:#AAB5AF; --bad:#E8603D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(76,154,255,0.09), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,32px);font-weight:700;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .progress-rail{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:32px;}
  .progress-fill{height:100%;background:var(--blue);width:0%;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-bottom:16px;}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:var(--surface-2);}
  .opt:hover{border-color:#3a463d;}
  .opt input{accent-color:var(--blue);margin-top:3px;flex-shrink:0;}
  .opt span{font-size:14.5px;line-height:1.4;}
  .opt.selected{border-color:var(--blue);background:rgba(76,154,255,0.08);}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--blue);color:#06140D;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:#3a463d;}
  #result{display:none;text-align:center;padding-top:8px;}
  .gauge-wrap{position:relative;width:220px;height:220px;margin:12px auto 8px;}
  .gauge-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gauge-score{font-size:44px;display:block;line-height:1;}
  .gauge-of{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:500;}
  .verdict{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 6px;}
  .verdict.pass{color:var(--blue);}
  .verdict.fail{color:var(--bad);}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}
  .review{text-align:left;margin-top:24px;}
  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;background:var(--surface-2);}
  .review-item.correct{border-left:3px solid var(--blue);}
  .review-item.incorrect{border-left:3px solid var(--bad);}
  .review-q{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:6px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/pem-gate.js"></script>




<div class="wrap">
  <div class="eyebrow">PEM Excellence Academy · Escuela Ambiental</div>
  <h1>Módulo 7 — Comunicación e Información Documentada Ambiental</h1>
  <div class="sub">ISO 14001 Cl. 7.4–7.5 · 10 reactivos · aprobatorio 80%</div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quiz"></div>
  <div class="navrow" id="navrow">
    <button class="btn-ghost" id="btnBack" onclick="prevQ()">Anterior</button>
    <button class="btn-primary" id="btnNext" onclick="nextQ()" disabled>Siguiente</button>
  </div>
  <div id="result">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle cx="110" cy="110" r="92" fill="none" stroke="#1B211D" stroke-width="14"/>
        <circle id="gaugeArc" cx="110" cy="110" r="92" fill="none" stroke="#4C9AFF" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
          transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="gauge-label">
        <span class="gauge-score" id="scoreNum">0%</span>
        <span class="gauge-of" id="scoreOf">0 / 10 correctas</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="verdict-sub" id="verdictSub"></div>
    <a id="certLink" class="btn-primary" href="#" style="display:none;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:10px;">Generar mi certificado →</a>
    <button class="btn-ghost" onclick="location.reload()" style="width:100%;box-sizing:border-box;">Reintentar examen</button>
    <div class="review" id="review"></div>
  </div>
  <footer>PEM-EXAM-14001-M7 · Production Enhancement México</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Ocurre un derrame menor en una base de PEM que, según el procedimiento interno, debe notificarse a la autoridad ambiental dentro de un plazo determinado. Nadie lo comunica a tiempo. Según Cl. 7.4, esto es principalmente una falla en:",
    options: [
      "La mala suerte; los derrames son, por su propia naturaleza, impredecibles en cualquier operación",
      "La comunicación externa planificada: qué, cuándo, a quién y cómo comunicar, incluidas obligaciones legales",
      "Un tema que corresponde de forma exclusiva al área legal, sin relación real con el SGA",
      "Algo que en realidad solo le corresponde reportar al cliente, y nunca directamente a PEM"
    ],
    correct: 1
  },
  {
    q: "Según la Cl. 7.4, la comunicación ambiental de PEM debe planificarse determinando:",
    options: [
      "Únicamente el medio de comunicación específico que se va a utilizar en cada caso",
      "Qué comunicar, cuándo, con quién, cómo y quién es responsable, tanto interna como externamente",
      "Solamente la comunicación dirigida al cliente, dejando fuera a la autoridad correspondiente",
      "Algo que se define una única vez, y que en la práctica nunca se vuelve a ajustar después"
    ],
    correct: 1
  },
  {
    q: "Una lección aprendida de un incidente ambiental menor en la base de Poza Rica nunca se comparte con las otras 4 bases, aunque el mismo riesgo aplica en todas. Esto representa:",
    options: [
      "Una decisión razonable, ya que en la práctica cada base opera de forma completamente independiente",
      "Una falla de comunicación interna que aumenta el riesgo de que el incidente se repita en otra base",
      "Un tema que, en realidad, no guarda ninguna relación directa con el sistema de gestión ambiental",
      "Algo que en realidad solamente le corresponde decidir a la autoridad ambiental competente"
    ],
    correct: 1
  },
  {
    q: "El 'control de la información documentada' ambiental (Cl. 7.5) exige que un procedimiento de manejo de residuos peligrosos esté:",
    options: [
      "Solamente almacenado en algún lugar accesible, sin que importe si se encuentra actualizado",
      "Disponible en su versión vigente donde se usa, y protegido contra pérdida o uso inadecuado",
      "Accesible de forma exclusiva para el área de HSE a nivel corporativo, sin llegar a las bases",
      "Impreso en papel en todas las bases de operación de PEM, sin ninguna versión digital disponible"
    ],
    correct: 1
  },
  {
    q: "Un supervisor usa una versión anterior del procedimiento de respuesta a derrames, que ya fue actualizada dos semanas antes. Esto representa el mismo riesgo visto en la Escuela de Calidad porque:",
    options: [
      "No existe ninguna relación real entre ambos casos, ya que pertenecen a sistemas distintos",
      "Una versión obsoleta en uso puede llevar a una decisión incorrecta ante una emergencia real",
      "Esto solamente afecta a la documentación, sin relación con la respuesta real ante un derrame",
      "Es una responsabilidad que corresponde de forma exclusiva al proveedor del procedimiento"
    ],
    correct: 1
  },
  {
    q: "¿Cuál de los siguientes es un ejemplo de comunicación EXTERNA relevante para el SGA de PEM según Cl. 7.4?",
    options: [
      "Una junta interna de resultados ambientales realizada entre los gerentes de cada base",
      "Notificar a SEMARNAT sobre un derrame que supera el umbral definido por la regulación vigente",
      "Un mensaje interno enviado entre dos supervisores que trabajan dentro de la misma base",
      "La capacitación interna que recibe un nuevo operador sobre el manejo de residuos"
    ],
    correct: 1
  },
  {
    q: "La 'retención y disposición' de la información documentada ambiental (parte de Cl. 7.5) se refiere a:",
    options: [
      "Cuánto tiempo se conservan los registros ambientales y cómo se archivan o eliminan cuando ya no son necesarios",
      "Quién tiene permiso para leer un documento en particular, y únicamente eso como criterio",
      "El formato específico en que se llega a imprimir un documento dentro de la empresa PEM",
      "Un concepto que, en realidad, no llega a aplicar a los registros ambientales que maneja PEM"
    ],
    correct: 0
  },
  {
    q: "Si un procedimiento de respuesta ante emergencias ambientales solo existe en la memoria de un supervisor experimentado, y no está documentado ni controlado, esto representa un riesgo porque:",
    options: [
      "No existe ningún riesgo real mientras esa persona siga trabajando activamente dentro de PEM",
      "El conocimiento no está protegido: si esa persona no está disponible, la información necesaria no existe",
      "Es una situación que corresponde resolver de forma exclusiva al área de Recursos Humanos",
      "La norma, en realidad, no exige documentar ningún tipo de conocimiento operativo ambiental"
    ],
    correct: 1
  },
  {
    q: "¿Cómo se conecta este módulo con la comunicación y la información documentada vistas en la Escuela de Calidad (Módulo 7 de esa escuela)?",
    options: [
      "No guarda ninguna relación real; se trata de requisitos que resultan completamente distintos entre sí",
      "Aplica la misma disciplina de planificación y control de versiones, ahora a información de tipo ambiental",
      "Reemplaza por completo, en la práctica, todo lo que ya se había visto en la Escuela de Calidad",
      "Solamente llega a relacionarse cuando el mismo documento en cuestión cubre ambos sistemas a la vez"
    ],
    correct: 1
  },
  {
    q: "El objetivo de este Módulo 7 es que cada colaborador de PEM entienda que comunicación e información documentada ambiental:",
    options: [
      "Son requisitos burocráticos que, en la práctica, solamente llegan a importar durante la auditoría externa",
      "Aseguran que la información ambiental correcta llegue a la persona correcta, en la versión vigente",
      "Solamente resultan aplicables a los documentos que maneja de forma directa el área de HSE",
      "Se resuelven de forma automática con solamente tener una carpeta compartida en algún servicio de nube"
    ],
    correct: 1
  }
];
(function shuffleOptions(){
  QUESTIONS.forEach(function(q){
    var idx = q.options.map(function(_,i){ return i; });
    for(var i=idx.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=idx[i]; idx[i]=idx[j]; idx[j]=t;
    }
    q.options = idx.map(function(i){ return q.options[i]; });
    q.correct = idx.indexOf(q.correct);
  });
})();

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
function renderQ(){
  const q = QUESTIONS[current];
  const el = document.getElementById('quiz');
  el.innerHTML = `
    <div class="card">
      <div class="qnum">PREGUNTA ${current+1} / ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      ${q.options.map((opt,i)=>`
        <label class="opt ${answers[current]===i?'selected':''}" onclick="selectOpt(${i})">
          <input type="radio" name="opt" ${answers[current]===i?'checked':''}>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100)+'%';
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').disabled = answers[current]===null;
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar examen' : 'Siguiente';
}
function selectOpt(i){ answers[current]=i; renderQ(); }
function nextQ(){
  if(answers[current]===null) return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); } else { finish(); }
}
function prevQ(){ if(current>0){current--;renderQ();} }
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('navrow').style.display='none';
  document.getElementById('progressFill').style.width='100%';
  let correct = 0;
  QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.correct) correct++; });
  const pct = Math.round(correct/QUESTIONS.length*100);
  const pass = pct>=80;
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i]===q.correct;
    return `<div class="review-item ${ok?'correct':'incorrect'}">
      <div class="review-q">PREGUNTA ${i+1} — ${ok?'CORRECTA':'INCORRECTA'}</div>
      <div>${q.q}</div>
      ${!ok && pass?`<div style="margin-top:8px;color:#4C9AFF;">Respuesta correcta: ${q.options[q.correct]}</div>`:''}
      ${!ok && !pass?`<div style="margin-top:8px;color:var(--muted);font-style:italic;">Revisa el video y las flashcards de este módulo antes de reintentar.</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('result').style.display='block';
  document.getElementById('scoreNum').textContent = pct+'%';
  document.getElementById('scoreOf').textContent = correct+' / '+QUESTIONS.length+' correctas';
  document.getElementById('review').innerHTML = reviewHtml;
  const verdict = document.getElementById('verdict');
  const verdictSub = document.getElementById('verdictSub');
  if(pass){
    verdict.textContent = 'Aprobado';
    verdict.className='verdict pass';
    const modMatch = location.pathname.match(/modulo(\d+)/);
    if(modMatch){
      const certLink = document.getElementById('certLink');
      certLink.href = 'certificado-modulo' + modMatch[1] + '.html?score=' + pct;
      certLink.style.display = 'block';
    }
    verdictSub.textContent = 'Cumples el estándar del Módulo 7. Tu certificado digital está listo para generarse.';
  } else {
    verdict.textContent = 'No aprobado';
    verdict.className='verdict fail';
    verdictSub.textContent = 'Se requiere 80% para aprobar. Revisa los reactivos abajo y vuelve a intentar.';
    document.getElementById('gaugeArc').style.stroke = '#E8603D';
  }
  const circumference = 578;
  const offset = circumference - (pct/100)*circumference;
  setTimeout(()=>{ document.getElementById('gaugeArc').style.strokeDashoffset = offset; },100);
}
renderQ();
</script>
<script src="../assets/shell.js?v=3" defer></script>
</body>
</html>
