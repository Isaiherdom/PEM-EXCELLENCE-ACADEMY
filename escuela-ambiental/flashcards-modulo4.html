<!DOCTYPE html>
<html lang="es">
<head>
<script>try{if(localStorage.getItem('pemTheme')==='pem-green')document.documentElement.setAttribute('data-theme','pem-green');}catch(e){}</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Módulo 4 · ISO 14001</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{--bg:#0B0E0C;--surface:#141815;--line:#26302A;--blue:#4C9AFF;--amber:#E8A33D;--text:#F1F3F0;--muted:#8A968E;}
  html[data-theme="pem-green"]{--bg:#071F14;--surface:#0A2A1C;--surface-2:#0F3D28;--line:#1A3D2C;--muted:#7C9688;--green:#4A8266;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:24px;}
  .stage{width:100%;max-width:460px;perspective:1400px;}
  .card{position:relative;width:100%;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;border:1px solid var(--line);}
  .front{background:var(--surface);}
  .back{background:linear-gradient(160deg,#0E1B24,#141815);transform:rotateY(180deg);border-color:var(--blue);}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:14px;}
  .term{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1.25;}
  .def{font-size:14px;line-height:1.55;color:var(--text);}
  .flip-hint{position:absolute;bottom:14px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .controls{display:flex;gap:12px;margin-top:26px;width:100%;max-width:460px;}
  button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{border-color:var(--blue);}
  button.primary{background:var(--blue);color:#06140D;border:none;}
  .dots{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;justify-content:center;max-width:460px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--blue);}
</style>
</head>
<body>
<a href="../index.html" class="pem-home-btn" aria-label="Volver al inicio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Inicio</a>
<style>
.pem-home-btn{position:fixed;top:16px;left:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;background:#0B1712;border:1.5px solid #16C270;color:#2CFF9B;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.03em;padding:9px 15px 9px 12px;border-radius:9px;text-decoration:none;box-shadow:0 0 16px rgba(22,194,112,.45),0 4px 14px rgba(0,0,0,.4);transition:.15s;}
.pem-home-btn:hover{background:#16C270;color:#06140D;box-shadow:0 0 22px rgba(22,194,112,.7),0 4px 14px rgba(0,0,0,.4);}
.pem-home-btn svg{flex-shrink:0;}
@media print{.pem-home-btn{display:none !important;}}
@media(max-width:480px){.pem-home-btn{top:10px;left:10px;padding:7px 12px 7px 10px;font-size:10px;}}
</style>

  <div class="eyebrow">PEM Excellence Academy</div>
  <h1>Flashcards — Módulo 4</h1>
  <div class="sub">Aspectos e impactos ambientales · ISO 14001 Cl. 6.1.2</div>
  <div class="counter" id="counter">1 / 10</div>
  <div class="stage">
    <div class="card" id="card" onclick="flip()">
      <div class="face front">
        <div class="tag">Término</div>
        <div class="term" id="termText"></div>
        <div class="flip-hint">Toca para ver la definición</div>
      </div>
      <div class="face back">
        <div class="tag">En PEM significa</div>
        <div class="def" id="defText"></div>
        <div class="flip-hint">Toca para volver</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button onclick="prev()">Anterior</button>
    <button class="primary" id="btnNext" onclick="next()">Siguiente</button>
  </div>
  <div class="dots" id="dots"></div>
<script>
const CARDS = [
  {term:"Aspecto ambiental", def:"Un elemento de la actividad de PEM que interactúa con el ambiente — ej. consumo de combustible de un compresor."},
  {term:"Impacto ambiental", def:"El efecto real de ese aspecto en el entorno — ej. emisiones a la atmósfera por el consumo de combustible."},
  {term:"Perspectiva de ciclo de vida", def:"Evaluar desde los recursos que entran hasta lo que sale del proceso, no solo el punto final."},
  {term:"Aspecto significativo", def:"Se evalúa por severidad, probabilidad, preocupación de partes interesadas y requisitos legales — no por impresión."},
  {term:"Controlar vs. influir", def:"PEM controla directamente sus procesos, pero solo influye en los de un proveedor externo — requiere otro tipo de acción."},
  {term:"Matriz de aspectos e impactos", def:"Registro que conecta cada actividad (generación, compresión) con sus aspectos e impactos potenciales."},
  {term:"Aspecto sin evaluar", def:"Identificarlo sin evaluar su significancia deja sin atención un riesgo real, como un derrame potencial."},
  {term:"Revisión periódica de aspectos", def:"Se actualiza con cada cambio relevante — nueva actividad, nueva base, cambio de proceso."},
  {term:"Conexión con contexto y ley", def:"Los criterios de significancia usan directamente las partes interesadas (M3) y el registro legal (M3)."},
  {term:"Propósito de este módulo", def:"Saber dónde concentrar controles y objetivos ambientales, priorizando lo realmente significativo."}
];
let idx = 0; let flipped = false;
function render(){
  document.getElementById('termText').textContent = CARDS[idx].term;
  document.getElementById('defText').textContent = CARDS[idx].def;
  document.getElementById('counter').textContent = (idx+1)+' / '+CARDS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  document.getElementById('dots').innerHTML = CARDS.map((_,i)=>`<div class="dot ${i===idx?'active':''}"></div>`).join('');
  document.getElementById('btnNext').textContent = (idx === CARDS.length - 1) ? 'Terminar ✓' : 'Siguiente';
}
function flip(){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function next(){
  if(idx === CARDS.length - 1){
    const home = document.querySelector('.pem-home-btn');
    window.location.href = home ? home.getAttribute('href') : 'index.html';
    return;
  }
  idx=(idx+1)%CARDS.length; render();
}
function prev(){ idx=(idx-1+CARDS.length)%CARDS.length; render(); }
render();
</script>
</body>
</html>
